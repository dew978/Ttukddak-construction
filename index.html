<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>뚝딱 건설 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#E4EAE2; --panel:#FAFBF7; --panel-2:#F0F3EC; --ink:#1B2530; --ink-2:#4B5966; --ink-3:#7A8791;
  --line:#D2DACD; --blue:#1D4E89; --blue-2:#2E6DB8; --blue-soft:#DDE8F5; --paper-blue:#18477E;
  --safety:#F2B300; --safety-2:#FFD34D; --safety-ink:#2A2100; --stripe:#23272B;
  --ok:#2F8A4E; --ok-soft:#DDF0E2; --warn:#D9731A; --warn-soft:#FBE9D6; --bad:#C23B34; --bad-soft:#F8DEDC;
  --sky:#D3E4E4;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r:10px;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
#app{display:grid;grid-template-columns:84px minmax(0,1fr) 368px;grid-template-rows:56px minmax(0,1fr);height:100%;}
/* ---------- top bar ---------- */
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding-inline:14px;background:var(--ink);color:#F4F6F1;position:relative;z-index:5}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(135deg,var(--safety) 0 12px,var(--stripe) 12px 24px)}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.5px;color:var(--safety)}
.brand span{font-size:12px;color:#AEB9C2}
.stats{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.stat{display:flex;flex-direction:column;justify-content:center;min-width:84px;padding:3px 10px;border-left:1px solid #34414D}
.stat small{font-size:11px;color:#9FB0BD;letter-spacing:.3px}
.stat strong{font-size:16px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.stat strong.flash-up{color:#8BE0A4}.stat strong.flash-down{color:#FF9A8B}
.top-actions{display:flex;gap:6px}
.tbtn{background:#2A3743;border:1px solid #3C4B58;border-radius:8px;padding:7px 11px;font-size:13px;color:#EAF0F3;white-space:nowrap}
.tbtn:hover{background:#34444F}
.tbtn[aria-pressed="true"]{background:var(--safety);color:var(--safety-ink);border-color:var(--safety)}
/* ---------- toolbar ---------- */
#tools{background:var(--panel);border-right:1px solid var(--line);padding:10px 6px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;scrollbar-width:thin}
.tgroup{font-size:10.5px;color:var(--ink-3);text-align:center;margin:3px 0 0;letter-spacing:.5px;border-top:1px solid var(--line);padding-top:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px 3px;border:1px solid transparent;border-radius:9px;background:transparent;font-size:11px;color:var(--ink-2);line-height:1.15}
.tool svg{width:22px;height:22px}
.tool:hover{background:var(--panel-2)}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tool[aria-pressed="true"] svg{color:var(--safety)}
/* ---------- map stage ---------- */
#stage{position:relative;overflow:hidden;background:var(--sky)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(27,37,48,.9);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
#zoomctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1}
#mission{position:absolute;left:12px;bottom:12px;width:min(340px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(20,30,40,.14);overflow:hidden}
#mission .mhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--blue);color:#fff}
#mission .mhead b{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.3px}
#mission .mhead span{font-size:11.5px;opacity:.85;margin-left:auto}
#mission .mbody{padding:9px 12px 11px;display:flex;flex-direction:column;gap:5px}
#mission .mtitle{font-weight:700;font-size:14.5px}
#mission .mdesc{font-size:12.5px;color:var(--ink-2);line-height:1.5}
#mission .mhint{font-size:12px;color:var(--blue);background:var(--blue-soft);border-radius:7px;padding:5px 8px;line-height:1.45}
#mission .mfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3)}
.linkbtn{background:none;border:none;color:var(--blue-2);font-size:12px;padding:0;text-decoration:underline}
#mission.collapsed .mbody{display:none}
/* ---------- side panel ---------- */
#panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin}
.phead{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.8px;color:var(--ink-3);text-transform:uppercase;font-weight:500}
.ptitle{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.3px;margin-top:2px;text-wrap:balance}
.psub{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.psec{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.psec h4{margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.psec h4 .tag{font-size:10.5px;font-weight:500;color:var(--ink-3);margin-left:auto}
.explain{font-size:12.5px;line-height:1.6;color:var(--ink-2);background:var(--panel-2);border-radius:8px;padding:8px 10px}
.explain b{color:var(--ink)}
#preview{width:100%;height:200px;display:block;border-radius:10px;background:#E8EFE9}
.preview-wrap{position:relative}
.preview-wrap .plabel{position:absolute;left:8px;top:8px;font-size:11px;background:rgba(255,255,255,.85);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
/* stepper */
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:10px}
.step{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.15}
.step i{display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}
.step.done i{background:var(--ok)} .step.done{color:var(--ok)}
.step.now i{background:repeating-linear-gradient(135deg,var(--safety) 0 6px,var(--stripe) 6px 12px)} .step.now{color:var(--ink);font-weight:700}
.stepper.s4{grid-template-columns:repeat(5,1fr)}
/* choice cards */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choices.one{grid-template-columns:1fr}
.choice{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.choice:hover{border-color:#AFC0CB}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice b{font-size:13px}
.choice span{font-size:11.5px;color:var(--ink-2);line-height:1.4}
.choice em{font-style:normal;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10.5px;border-radius:10px;padding:1px 6px;background:var(--panel-2);color:var(--ink-2)}
.chip.good{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid rgba(0,0,0,.12)}
.sw[aria-pressed="true"]{outline:3px solid var(--blue);outline-offset:2px}
.segs{display:flex;gap:4px;flex-wrap:wrap}
.seg{flex:1;min-width:60px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 4px;font-size:12.5px;text-align:center}
.seg[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.seg[disabled]{opacity:.4;cursor:not-allowed}
/* quiz */
.quiz{border:1.5px dashed #B9C6CF;border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:7px;background:#fff}
.quiz.solved{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.quiz .q{font-size:13px;font-weight:700;line-height:1.45}
.qopts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.qopt{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;line-height:1.2}
.qopt img{width:52px;height:39px}
.qopt:hover{border-color:var(--blue-2)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qfb{font-size:12px;line-height:1.5}
.qfb.ok{color:var(--ok)} .qfb.no{color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.checks{display:flex;flex-direction:column;gap:5px}
.check{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;text-align:left;font-size:12.5px}
.check i{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.check[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.check[aria-pressed="true"] i{background:var(--ok);border-color:var(--ok)}
.check small{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* footer / buttons */
.pfoot{position:sticky;bottom:0;margin-top:auto;padding:12px 16px 14px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.costline{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.costline b{font-variant-numeric:tabular-nums;color:var(--ink)}
.costline b.over{color:var(--bad)}
.btn{border:none;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14.5px;background:var(--panel-2);border:1px solid var(--line)}
.btn.primary{background:var(--safety);color:var(--safety-ink);border-color:#D89F00;box-shadow:0 2px 0 #B98800}
.btn.primary:hover{background:var(--safety-2)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.small{padding:6px 10px;font-size:12.5px;border-radius:8px}
.row{display:flex;gap:6px}.row>.btn{flex:1}
.progress{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(135deg,var(--safety) 0 8px,#E3A100 8px 16px);transition:width .1s linear}
.need{font-size:12px;color:var(--warn);line-height:1.45}
/* report */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-size:12.5px}
.bar .track{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:5px}
.bar b{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.conn{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.conn div{font-size:12.5px;border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:6px}
.conn .y{background:var(--ok-soft);color:var(--ok)} .conn .n{background:var(--bad-soft);color:var(--bad)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.spec dt{color:var(--ink-3)} .spec dd{margin:0}
.projlist{display:flex;flex-direction:column;gap:5px}
.proj{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:12.5px}
.proj small{margin-left:auto;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv div{background:var(--panel-2);border-radius:8px;padding:7px 9px}
.kv small{display:block;font-size:11px;color:var(--ink-3)}
.kv b{font-size:17px;font-variant-numeric:tabular-nums}
input[type=text]{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
/* toasts & modal */
#toasts{position:fixed;left:50%;top:112px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:40;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .25s ease-out;line-height:1.5}
.toast.good{background:var(--ok)} .toast.bad{background:var(--bad)} .toast.gold{background:var(--safety);color:var(--safety-ink)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(18,26,34,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:16px;max-width:760px;width:100%;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--panel);z-index:1}
.modal .mh h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.modal .mh button{margin-left:auto}
.modal .mb{padding:16px 22px 22px;display:flex;flex-direction:column;gap:14px;line-height:1.6}
.modal h3{margin:6px 0 0;font-size:15px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow div{flex:1;min-width:110px;background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:12.5px;border-top:4px solid var(--blue)}
.flow div b{display:block;font-size:13.5px}
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.machine{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.machine img{width:80px;height:60px}
.machine b{font-size:13.5px;color:var(--ink)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.mitem i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--panel-2);color:var(--ink-3);font-size:12px}
.mitem.done i{background:var(--ok);color:#fff}
.mitem.cur{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.mitem small{display:block;color:var(--ink-2);font-size:12px}
/* start screen */
#start{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:
  linear-gradient(rgba(24,71,126,.93),rgba(24,71,126,.93)),
  repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.18) 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,rgba(255,255,255,.18) 23px 24px);
  background-color:var(--paper-blue);color:#fff;overflow:auto}
#start .card{width:min(720px,100%);display:flex;flex-direction:column;gap:16px}
#start h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,58px);margin:0;line-height:1.05;letter-spacing:1px}
#start h1 em{font-style:normal;color:var(--safety)}
#start p{margin:0;font-size:15px;line-height:1.7;color:#D6E3F2;max-width:62ch}
#start .order{display:flex;flex-wrap:wrap;gap:6px}
#start .order span{border:1.5px solid rgba(255,255,255,.55);border-radius:6px;padding:4px 10px;font-size:13px}
#start .order span.arrow{border:none;padding:4px 0;opacity:.7}
#start .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#start .mode{text-align:left;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.06);border-radius:12px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:4px}
#start .mode:hover{background:rgba(255,255,255,.14)}
#start .mode b{font-family:var(--display);font-weight:400;font-size:22px}
#start .mode span{font-size:13px;color:#D6E3F2;line-height:1.5}
#start .mode.primary{background:var(--safety);border-color:var(--safety);color:var(--safety-ink)}
#start .mode.primary span{color:#4A3A00}
#start .mode.primary:hover{background:var(--safety-2)}
#start .foot{font-size:12px;color:#A9C1DD}

/* ---------- 눌러서 보는 설명 ---------- */
#pop{position:fixed;z-index:70;pointer-events:none;max-width:260px;background:var(--ink);color:#F4F6F1;border-radius:11px;padding:10px 13px;font-size:13px;line-height:1.55;box-shadow:0 10px 28px rgba(0,0,0,.28);animation:tin .15s ease-out}
#pop b{display:block;color:var(--safety);font-size:14px;margin-bottom:2px}
#pop p{margin:0;color:#DDE5EA}
#pop p b{display:inline;color:#fff;font-size:inherit;margin:0}
.tchip{display:inline-block;font-size:11px;border-radius:9px;padding:0 7px;background:#34414D;color:#DDE5EA;margin-top:4px}
.tchip.good{background:#2F6A45;color:#D8F3E0}.tchip.bad{background:#7A2F2A;color:#FFE1DD}
.info{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--blue-2);font:700 12px/1 var(--body);margin-left:8px;vertical-align:4px;padding:0}
.info:hover{border-color:var(--blue-2)}
.pill{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.warn{background:var(--warn-soft);border-color:#F0C9A0;color:var(--warn)}
.pill.ok{background:var(--ok-soft);border-color:#B9DFC4;color:var(--ok)}
.pill.bad{background:var(--bad-soft);border-color:#EDB9B4;color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tiles.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 3px 6px;min-width:0}
.tile:hover{border-color:#AFC0CB}
.tile .th{width:34px;height:34px;border-radius:7px;overflow:hidden;flex:none}
.tile .tn{font-size:12px;font-weight:700;text-align:center;line-height:1.2;word-break:keep-all}
.tile .tc{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tile[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.tile.off{opacity:.45}
.tbadge{position:absolute;top:3px;right:5px;font-size:11px;color:var(--bad);font-weight:700}
.tchk{position:absolute;top:3px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:grid;place-items:center}
.step{background:none;border:none;padding:0;cursor:pointer}

<script>

/* ================= 텍스처 ================= */
function shade(hex,p){const c=new THREE.Color(hex);c.lerp(p>=0?new THREE.Color(1,1,1):new THREE.Color(0,0,0),Math.abs(p));return '#'+c.getHexString();}
const texCache={};
function tex(key,draw,size=256){
  if(texCache[key])return texCache[key];
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');draw(g,size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return texCache[key]=t;
}
function speck(g,s,n,col,a,r=1.5){g.globalAlpha=a;g.fillStyle=col;for(let k=0;k<n;k++)g.fillRect(rnd()*s,rnd()*s,r,r);g.globalAlpha=1;}
const TX={
  solar:()=>tex('solar',(g,s)=>{g.fillStyle='#C9D2DC';g.fillRect(0,0,s,s);const n=4,w=s/n;for(let a=0;a<n;a++)for(let b=0;b<n;b++){const gr=g.createLinearGradient(a*w,b*w,a*w+w,b*w+w);gr.addColorStop(0,'#2B4A78');gr.addColorStop(1,'#16294A');g.fillStyle=gr;g.fillRect(a*w+3,b*w+3,w-6,w-6);g.strokeStyle='rgba(160,190,230,.35)';g.beginPath();g.moveTo(a*w+w/2,b*w+3);g.lineTo(a*w+w/2,b*w+w-3);g.moveTo(a*w+3,b*w+w/2);g.lineTo(a*w+w-3,b*w+w/2);g.stroke();}}),
  brick:c=>tex('brick'+c,(g,s)=>{g.fillStyle='#d6d0c4';g.fillRect(0,0,s,s);const rows=8,bh=s/rows,bw=s/4;for(let r=0;r<rows;r++){const off=(r%2)*bw/2;for(let k=-1;k<5;k++){g.fillStyle=shade(c,(rnd()-.5)*.28);g.fillRect(k*bw+off+2,r*bh+2,bw-4,bh-4);}}speck(g,s,900,'#000',.1);}),
  siding:c=>tex('sid'+c,(g,s)=>{const n=8,h=s/n;for(let r=0;r<n;r++){const gr=g.createLinearGradient(0,r*h,0,r*h+h);gr.addColorStop(0,shade(c,.14));gr.addColorStop(1,shade(c,-.14));g.fillStyle=gr;g.fillRect(0,r*h,s,h);g.fillStyle=shade(c,-.38);g.fillRect(0,r*h+h-3,s,3);}}),
  stucco:c=>tex('stu'+c,(g,s)=>{g.fillStyle=c;g.fillRect(0,0,s,s);speck(g,s,3500,'#000',.07,2);speck(g,s,3500,'#fff',.1,2);}),
  stone:c=>tex('sto'+c,(g,s)=>{g.fillStyle=shade(c,-.45);g.fillRect(0,0,s,s);const rows=4,h=s/rows;for(let r=0;r<rows;r++){let x=-rnd()*40;while(x<s){const w=44+rnd()*60;g.fillStyle=shade(c,(rnd()-.5)*.4);g.fillRect(x+3,r*h+3,w-6,h-6);x+=w;}}speck(g,s,1800,'#000',.1);}),
  giwa:c=>tex('giwa'+c,(g,s)=>{g.fillStyle=shade(c,-.5);g.fillRect(0,0,s,s);const n=6,w=s/n;for(let k=0;k<n;k++){const gr=g.createLinearGradient(k*w,0,k*w+w,0);gr.addColorStop(0,shade(c,-.3));gr.addColorStop(.5,shade(c,.18));gr.addColorStop(1,shade(c,-.3));g.fillStyle=gr;g.fillRect(k*w+2,0,w-4,s);}g.fillStyle='rgba(0,0,0,.28)';for(let r=0;r<5;r++)g.fillRect(0,r*s/5,s,4);}),
  shingle:c=>tex('shi'+c,(g,s)=>{g.fillStyle=shade(c,-.55);g.fillRect(0,0,s,s);const rows=6,h=s/rows,w=s/5;for(let r=0;r<rows;r++){const off=(r%2)*w/2;for(let k=-1;k<6;k++){g.fillStyle=shade(c,(rnd()-.5)*.3);g.fillRect(k*w+off+1,r*h+1,w-2,h-4);}}speck(g,s,2500,'#000',.14);}),
  metal:c=>tex('met'+c,(g,s)=>{const n=4,w=s/n;for(let k=0;k<n;k++){const gr=g.createLinearGradient(k*w,0,k*w+w,0);gr.addColorStop(0,shade(c,.12));gr.addColorStop(1,shade(c,-.12));g.fillStyle=gr;g.fillRect(k*w,0,w,s);g.fillStyle=shade(c,.4);g.fillRect(k*w,0,4,s);}}),
  maru:c=>tex('maru'+c,(g,s)=>{const n=6,h=s/n;for(let r=0;r<n;r++){let x=-rnd()*s/2;while(x<s){const w=s*.5+rnd()*s*.4;g.fillStyle=shade(c,(rnd()-.5)*.22);g.fillRect(x,r*h,w,h);g.strokeStyle='rgba(0,0,0,.09)';for(let q=0;q<4;q++){g.beginPath();g.moveTo(x,r*h+rnd()*h);g.lineTo(x+w,r*h+rnd()*h);g.stroke();}g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x,r*h,2,h);x+=w;}g.fillStyle='rgba(0,0,0,.3)';g.fillRect(0,r*h,s,2);}}),
  tile:c=>tex('tile'+c,(g,s)=>{g.fillStyle='#bdb8b0';g.fillRect(0,0,s,s);const n=3,w=s/n;for(let a=0;a<n;a++)for(let b=0;b<n;b++){g.fillStyle=shade(c,(rnd()-.5)*.1);g.fillRect(a*w+2,b*w+2,w-4,w-4);}}),
  jangpan:c=>tex('jp'+c,(g,s)=>{g.fillStyle=c;g.fillRect(0,0,s,s);g.strokeStyle=shade(c,-.12);g.lineWidth=2;for(let k=0;k<s;k+=32){g.strokeRect(k+4,4,24,s-8);}speck(g,s,800,'#fff',.15,2);}),
  grass:()=>tex('grass',(g,s)=>{g.fillStyle='#86BA5E';g.fillRect(0,0,s,s);speck(g,s,6000,'#679F46',.55,2);speck(g,s,3500,'#A6D177',.5,2);}),
  soil:()=>tex('soil',(g,s)=>{g.fillStyle='#8B6A4A';g.fillRect(0,0,s,s);speck(g,s,5000,'#6B4E33',.6,2);speck(g,s,2500,'#A88563',.5,2);}),
  gravel:()=>tex('gravel',(g,s)=>{g.fillStyle='#A39B8F';g.fillRect(0,0,s,s);for(let k=0;k<1100;k++){g.fillStyle=shade('#9a9186',(rnd()-.5)*.7);g.beginPath();g.arc(rnd()*s,rnd()*s,2+rnd()*4,0,7);g.fill();}}),
  asphalt:()=>tex('asp',(g,s)=>{g.fillStyle='#3B3E44';g.fillRect(0,0,s,s);speck(g,s,7000,'#565A61',.6,2);speck(g,s,3000,'#222',.5,2);}),
  concrete:()=>tex('con',(g,s)=>{g.fillStyle='#BDBCB5';g.fillRect(0,0,s,s);speck(g,s,5000,'#9d9c96',.5,2);speck(g,s,3000,'#d6d5cf',.5,2);}),
  pavers:()=>tex('pav',(g,s)=>{g.fillStyle='#857d72';g.fillRect(0,0,s,s);const rows=8,h=s/rows,w=s/4,cs=['#C0856A','#B5A48C','#9E7862'];for(let r=0;r<rows;r++){const off=(r%2)*w/2;for(let k=-1;k<5;k++){g.fillStyle=shade(cs[(r*3+k+9)%3],(rnd()-.5)*.14);g.fillRect(k*w+off+2,r*h+2,w-4,h-4);}}}),
  sand:()=>tex('sand',(g,s)=>{g.fillStyle='#A99472';g.fillRect(0,0,s,s);speck(g,s,5000,'#8a7657',.5,2);}),
  water:()=>tex('water',(g,s)=>{g.fillStyle='#3F8FC2';g.fillRect(0,0,s,s);g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;for(let k=0;k<40;k++){const x=rnd()*s,y=rnd()*s;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+10,y-4,x+22,y);g.stroke();}}),
  ply:()=>tex('ply',(g,s)=>{g.fillStyle='#D9B886';g.fillRect(0,0,s,s);g.strokeStyle='rgba(120,80,30,.18)';for(let k=0;k<30;k++){g.beginPath();const y=rnd()*s;g.moveTo(0,y);g.bezierCurveTo(s/3,y+rnd()*20-10,s*2/3,y+rnd()*20-10,s,y);g.stroke();}g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,s,3);g.fillRect(0,0,3,s);})
};
function M(o){return new THREE.MeshStandardMaterial(Object.assign({roughness:.85,metalness:0},o));}
function TM(t,scale=1,o={}){const tt=t.clone();tt.needsUpdate=true;tt.repeat.set(1/scale,1/scale);return M(Object.assign({map:tt},o));}

/* ================= 도형 도우미 ================= */
function boxUV(g,w,h,d,ox=0,oy=0){const uv=g.attributes.uv,dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let k=0;k<4;k++){const i=f*4+k,a=f>=4?ox:0,b=f>=4?oy:0;uv.setXY(i,uv.getX(i)*dims[f][0]+a,uv.getY(i)*dims[f][1]+b);}uv.needsUpdate=true;}
function box(w,h,d,mat,x=0,y=0,z=0,ox=0,oy=0){const g=new THREE.BoxGeometry(w,h,d);boxUV(g,w,h,d,ox,oy);g.translate(0,h/2,0);const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const _Z=V(0,0,1),_Y=V(0,1,0);
function link(a,b,w,h,mat,fromStart=false){const d=new THREE.Vector3().subVectors(b,a),L=d.length();const g=new THREE.BoxGeometry(w,h,L);boxUV(g,w,h,L);if(fromStart)g.translate(0,0,L/2);
  const m=new THREE.Mesh(g,mat);m.quaternion.setFromUnitVectors(_Z,d.normalize());if(fromStart)m.position.copy(a);else m.position.copy(a).add(b).multiplyScalar(.5);m.castShadow=m.receiveShadow=true;return m;}
function rod(a,b,r,mat,seg=8){const d=new THREE.Vector3().subVectors(b,a),L=d.length();const g=new THREE.CylinderGeometry(r,r,L,seg);g.translate(0,L/2,0);
  const m=new THREE.Mesh(g,mat);m.quaternion.setFromUnitVectors(_Y,d.normalize());m.position.copy(a);m.castShadow=true;return m;}
function hide(m){m.visible=false;return m;}

/* ================= 애니메이션 ================= */
let speed=1,instant=false;const tweens=[];
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const backOut=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const lin=p=>p;
function tw(ms,fn,e=ease){if(instant){fn(1);return Promise.resolve();}return new Promise(res=>tweens.push({t:0,ms,fn,e,res}));}
function wait(ms){return tw(ms,()=>{});}
function ctw(ms,fn,e=ease){return new Promise(res=>tweens.push({t:0,ms,fn,e,res,real:true}));}
function runTweens(dt){for(let k=tweens.length-1;k>=0;k--){const w=tweens[k];w.t+=dt*(w.real?1:speed);const p=Math.min(1,w.t/w.ms);w.fn(w.e(p));if(p>=1){tweens.splice(k,1);w.res();}}}
const S=.0001;
function growY(m,ms=600){m.scale.y=S;m.visible=true;return tw(ms,p=>m.scale.y=Math.max(S,p));}
function growX(m,ms=600){m.scale.x=S;m.visible=true;return tw(ms,p=>m.scale.x=Math.max(S,p));}
function growZ(m,ms=600){m.scale.z=S;m.visible=true;return tw(ms,p=>m.scale.z=Math.max(S,p));}
function growXZ(m,ms=600){m.scale.set(S,1,S);m.visible=true;return tw(ms,p=>{m.scale.x=m.scale.z=Math.max(S,p);});}
function pop(m,ms=450){m.scale.setScalar(S);m.visible=true;return tw(ms,p=>m.scale.setScalar(Math.max(S,p)),backOut);}
function drop(m,ms=650,h=3){const y=m.position.y;m.position.y=y+h;m.visible=true;return tw(ms,p=>m.position.y=y+(1-p)*h,easeOut);}
function slideX(m,ms,dx){const x=m.position.x;m.position.x=x+dx;m.visible=true;return tw(ms,p=>m.position.x=x+(1-p)*dx);}
function stagger(list,gap,fn){return Promise.all(list.map((m,k)=>wait(k*gap).then(()=>fn(m,k))));}
async function vanish(m,ms=450){if(!m)return;const s0=m.scale.clone();await tw(ms,p=>m.scale.set(Math.max(S,s0.x*(1-p)),Math.max(S,s0.y*(1-p)),Math.max(S,s0.z*(1-p))));if(m.parent)m.parent.remove(m);}
function drawTube(m,ms){const g=m.geometry,total=g.index.count;g.setDrawRange(0,0);m.visible=true;return tw(ms,p=>g.setDrawRange(0,Math.floor(p*total/3)*3),lin);}

/* ================= 지형 ================= */
const matGrass=TM(TX.grass(),4),matSoil=TM(TX.soil(),2),matSand=TM(TX.sand(),3);
const ground=new THREE.Group();scene.add(ground);
(function(){

  const east=new THREE.Mesh(new THREE.BoxGeometry(eW,3,48),mats);east.position.set(RX1+eW/2,-1.5,0);
  [west,east].forEach(m=>{const g=m.geometry;boxUV(g,g.parameters.width,3,48);m.receiveShadow=true;ground.add(m);});
  const bg=new THREE.BoxGeometry(RX1-RX0,3+BED,48);boxUV(bg,RX1-RX0,3+BED,48);bg.translate(0,(3+BED)/2,0);
  const bedM=new THREE.Mesh(bg,matSand);bedM.position.set(RCX,-3,0);bedM.receiveShadow=true;ground.add(bedM);
  const wt=TX.water();wt.repeat.set(1.5,12);

  const water=new THREE.Mesh(new THREE.PlaneGeometry(RX1-RX0,48),wm);water.rotation.x=-Math.PI/2;water.position.set(RCX,WATER,0);ground.add(water);
  window._waterTex=wt;
  // 멀리 보이는 산
  const mm=M({color:0x7FA37A,flatShading:true}),mm2=M({color:0x94B48A,flatShading:true});
  [[-52,-50,14,9],[-20,-62,16,11],[14,-64,18,12],[46,-52,14,9],[62,-10,12,8],[-62,8,12,7],[58,34,11,7],[-44,58,12,6]].forEach(([x,z,r,h],k)=>{
    const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),k%2?mm:mm2);c.position.set(x,h/2-1.5,z);ground.add(c);});
})();
const gridLines=new THREE.GridHelper(48,24,0x3E5A2A,0x3E5A2A);gridLines.position.y=.012;gridLines.material.transparent=true;gridLines.material.opacity=.16;scene.add(gridLines);

/* 나무 */
const matTrunk=M({color:0x7A5436}),matLeaf=M({color:0x4F9A45,flatShading:true}),matLeaf2=M({color:0x3F8440,flatShading:true});
const trees={};
function makeTree(x,z,s){const g=new THREE.Group();g.add(box(.2*s,.9*s,.2*s,matTrunk));const cone=rnd()<.5;
  const c=cone?new THREE.Mesh(new THREE.ConeGeometry(.75*s,1.8*s,7),matLeaf2):new THREE.Mesh(new THREE.IcosahedronGeometry(.72*s,0),matLeaf);
  c.position.y=cone?1.7*s:1.45*s;c.castShadow=true;g.add(c);g.position.set(x,0,z);g.rotation.y=rnd()*6;return g;}
function plantTrees(keep){for(let k=0;k<200&&Object.keys(trees).length<62;k++){const i=Math.floor(rnd()*N),j=Math.floor(rnd()*N);
  if(grid[i][j]||keep(i,j))continue;const [x,z]=tc(i,j);const t=makeTree(x+(rnd()-.5)*.8,z+(rnd()-.5)*.8,.8+rnd()*.5);addW(t);trees[i+','+j]=t;grid[i][j]='tree';}}
/* 직접 심는 나무 (위치마다 모양이 정해져 있어 다시 불러와도 같아요) */
function plantTreeAt(i,j){const [x,z]=tc(i,j),s0=seed;seed=(i*97+j*31+7)%2147483646+1;const t=makeTree(x+(rnd()-.5)*.6,z+(rnd()-.5)*.6,.75+rnd()*.4);seed=s0;
  addW(t);trees[i+','+j]=t;grid[i][j]='tree';return t;}
async function clearTree(i,j){const t=trees[i+','+j];if(!t)return;delete trees[i+','+j];if(grid[i][j]==='tree')grid[i][j]=null;await vanish(t,400);}

/* ================= 공사 장비 ================= */
const matYel=M({color:0xF2B21B,roughness:.6}),matDark=M({color:0x2F3237}),matGlassE=M({color:0x9CC6E0,roughness:.2,metalness:.2}),matSteelG=M({color:0x9AA1A8,metalness:.5,roughness:.45}),matWhite=M({color:0xF3F3F0});
function excavator(){const g=new THREE.Group();g.add(box(1.5,.35,1.1,matDark));const up=new THREE.Group();up.position.y=.35;g.add(up);
  up.add(box(1.2,.55,1.0,matYel,.1,0,0));up.add(box(.5,.55,.5,matGlassE,-.25,.55,.22));
  const arm=new THREE.Group();arm.position.set(-.45,.5,-.2);up.add(arm);
  const boom=box(.16,1.5,.16,matYel);boom.rotation.z=.9;arm.add(boom);const stick=box(.12,1.1,.12,matYel,-1.18,.9,0);stick.rotation.z=-.5;arm.add(stick);
  const bucket=box(.35,.3,.4,matDark,-.9,.0,0);stick.add(bucket);bucket.position.set(0,1.1,0);
  g.userData.arm=arm;g.userData.up=up;return g;}
function mixer(){const g=new THREE.Group();g.add(box(2.3,.3,.9,matDark,0,.25,0));g.add(box(.7,.7,.9,matWhite,.85,.55,0));g.add(box(.3,.35,.8,matGlassE,1.08,.8,0));
  const drum=new THREE.Mesh(new THREE.CylinderGeometry(.42,.3,1.4,12),M({color:0xE8E3D6}));drum.rotation.z=Math.PI/2+.25;drum.position.set(-.35,1.0,0);drum.castShadow=true;g.add(drum);
  const stripe=new THREE.Mesh(new THREE.TorusGeometry(.4,.04,6,16),M({color:0xD04A2E}));stripe.rotation.y=Math.PI/2;drum.add(stripe);stripe.rotation.set(Math.PI/2,0,0);
  [[.7,.45],[.7,-.45],[-.8,.45],[-.8,-.45]].forEach(([x,z])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.16,12),matDark);w.rotation.x=Math.PI/2;w.position.set(x,.22,z);g.add(w);});
  g.userData.drum=drum;return g;}
function roller(){const g=new THREE.Group();g.add(box(1.0,.45,.8,matYel,-.2,.2,0));g.add(box(.45,.55,.6,matGlassE,-.35,.65,0));
  const d=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.9,14),matSteelG);d.rotation.x=Math.PI/2;d.position.set(.55,.32,0);d.castShadow=true;g.add(d);g.userData.drum=d;return g;}
function piledriver(){const g=new THREE.Group();g.add(box(1.3,.3,.9,matDark));g.add(box(.9,.5,.8,matYel,-.1,.3,0));g.add(box(.4,.45,.4,matGlassE,-.35,.8,.18));
  g.add(box(.14,3.2,.14,matSteelG,.5,.3,0));const ham=box(.3,.4,.3,matDark,.5,2.6,0);g.add(ham);g.userData.ham=ham;return g;}
function bulldozer(){const g=new THREE.Group();g.add(box(1.3,.32,1.0,matDark));g.add(box(1.0,.45,.8,matYel,-.1,.32,0));g.add(box(.45,.45,.45,matGlassE,-.3,.77,0));
  const bl=box(.12,.55,1.25,matSteelG,.78,.02,0);bl.rotation.z=-.15;g.add(bl);return g;}
function paver(){const g=new THREE.Group();g.add(box(1.5,.3,1.1,matDark));g.add(box(1.1,.45,1.0,matYel,-.1,.3,0));g.add(box(.5,.12,1.2,matSteelG,-.75,.05,0));
  g.add(box(.45,.35,.9,M({color:0x3B3E44}),.55,.3,0));g.add(box(.35,.4,.35,matGlassE,-.2,.75,.2));return g;}
function crane(h){const g=new THREE.Group();g.add(box(1.2,.3,1.2,matDark));const mast=box(.28,h,.28,matYel,0,.3,0);g.add(mast);
  const jib=new THREE.Group();jib.position.y=h+.3;g.add(jib);jib.add(box(5,.22,.22,matYel,1.6,0,0));jib.add(box(.8,.4,.4,M({color:0x6B6F75}),-1.1,-.1,0));
  const hook=rod(V(3,-.01,0),V(3,-1.6,0),.015,matDark);jib.add(hook);g.userData.jib=jib;return g;}

<script>
/* ================= 집: 치수와 도우미 ================= */
function dims(P){const d=P.design,z=SIZES[d.size];const R={gable:1.35,hip:1.5,shed:.95,flat:0}[d.roof];
  return {W:z.W,D:z.D,H:2.6,F:.35,t:.24,floors:d.floors,roof:d.roof,R,ov:.35,win:WINSTYLES[d.win]};}
function perim(hx,hz,sp){const pts=[],c=[[-hx,-hz],[hx,-hz],[hx,hz],[-hx,hz]];
  for(let q=0;q<4;q++){const a=c[q],b=c[(q+1)%4],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(L/sp));
    for(let k=0;k<n;k++)pts.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}return pts;}
function wallSides(d){const {W,D,t}=d;return [
  {side:'front',x:0,z:D/2-t/2,ry:0,L:W},{side:'back',x:0,z:-D/2+t/2,ry:Math.PI,L:W},
  {side:'left',x:-W/2+t/2,z:0,ry:-Math.PI/2,L:D-2*t},{side:'right',x:W/2-t/2,z:0,ry:Math.PI/2,L:D-2*t}];}
function wallOps(d,side,k,L){const w=d.win,o=[];
  if(side==='front'&&k===0){o.push({x:-L/4,w:.9,h:2.05,y:0,door:true},{x:L/4,w:Math.min(w.w,L/2-.6),h:w.h,y:w.y});}
  else if(w.w>1)o.push({x:0,w:Math.min(w.w,L-1.2),h:w.h,y:w.y});
  else if(L>2.6)o.push({x:-L/4,w:w.w,h:w.h,y:w.y},{x:L/4,w:w.w,h:w.h,y:w.y});
  else o.push({x:0,w:w.w,h:w.h,y:w.y});return o;}
function wallBoxes(L,h,th,ops,mat,z=0){const g=new THREE.Group(),xs=[...ops].sort((a,b)=>a.x-b.x);let cur=-L/2;
  const put=(x0,x1,y0,y1)=>{if(x1-x0<.01||y1-y0<.01)return;g.add(box(x1-x0,y1-y0,th,mat,(x0+x1)/2,y0,z,x0,y0));};
  for(const o of xs){const a=o.x-o.w/2,b=o.x+o.w/2;put(cur,a,0,h);put(a,b,0,o.y);put(a,b,o.y+o.h,h);cur=b;}put(cur,L/2,0,h);return g;}
function openingMesh(o,th,fr,glass,doorM,panes=2){const g=new THREE.Group(),f=.07,dd=th+.03;
  g.add(box(f,o.h,dd,fr,-o.w/2+f/2,0,0),box(f,o.h,dd,fr,o.w/2-f/2,0,0),box(o.w,f,dd,fr,0,o.h-f,0));
  if(o.door){g.add(box(o.w-2*f,o.h-f,.06,doorM,0,0,.04));const kb=new THREE.Mesh(new THREE.SphereGeometry(.04,8,6),matSteelG);kb.position.set(o.w/2-.2,1.0,.1);g.add(kb);}
  else{g.add(box(o.w,f,dd,fr,0,0,0),box(o.w-2*f,o.h-2*f,.02,glass,0,f,0),box(o.w+.12,.05,th+.14,fr,0,-.04,.03));
    for(let k=1;k<panes;k++)g.add(box(.045,o.h-2*f,.07,fr,-o.w/2+o.w*k/panes,f,0));}
  g.position.set(o.x,o.y,0);return g;}
function triGeo(base,h,th,apex=0){const s=new THREE.Shape();s.moveTo(-base/2,0);s.lineTo(base/2,0);s.lineTo(apex*base/2,h);s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:th,bevelEnabled:false});g.translate(0,0,-th/2);return g;}
function pyramidGeo(){const g=new THREE.ConeGeometry(Math.SQRT1_2,1,4,1);g.rotateY(Math.PI/4);g.translate(0,.5,0);return g;}
/* 지붕 경사면: 처마 쪽 a → 꼭대기 b (외쪽지붕은 앞 낮은 처마 → 뒤 높은 처마) */
function roofLine(d,Ytop,sg=1){const {D,R,ov}=d;
  if(d.roof==='shed'){const s=R/D;return {a:V(0,Ytop-ov*s,D/2+ov),b:V(0,Ytop+R+ov*s,-D/2-ov)};}
  const s=R/(D/2);return {a:V(0,Ytop-ov*s,sg*(D/2+ov)),b:V(0,Ytop+R,0)};}

/* ================= 집: 프로젝트 ================= */
function footprint(i,j){const t=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)t.push([i+a,j+b]);return t;}
function canHouse(i,j){return footprint(i,j).every(([a,b])=>inMap(a,b)&&(grid[a][b]===null||grid[a][b]==='tree'));}
function isSoft(i,j){return footprint(i,j).some(([a])=>a===RIVER0-1||a===RIVER1+1);}
function newHouse(i,j,design,name,rot=0){const [cx,cz]=tc(i,j);
  const P={id:++state.nextId,type:'house',i,j,cx,cz,rot,name,stage:0,design:{...design},ch:{util:{}},qz:{},qw:{},
    g:new THREE.Group(),mats:{},walls:[],cut:false,soft:isSoft(i,j),tilt:false,spent:0};
  P.g.position.set(cx,0,cz);addW(P.g);
  P.trees=[];footprint(i,j).forEach(([a,b])=>{if(grid[a][b]==='tree')P.trees.push([a,b]);grid[a][b]='house';owner[a][b]=P;});
  drawBlueprint(P);return P;}
const bpMat=new THREE.LineBasicMaterial({color:0x2D6CDF}),bpFill=new THREE.MeshBasicMaterial({color:0x2D6CDF,transparent:true,opacity:.14,depthWrite:false});
function blueprintGroup(P){const d=dims(P),{W,D,H,F,floors,R,ov}=d,g=new THREE.Group();
  const edges=(geo,y)=>{const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),bpMat);e.position.y=y;g.add(e);};
  for(let k=0;k<floors;k++)edges(new THREE.BoxGeometry(W,H,D),F+k*H+H/2);
  const top=F+floors*H;
  if(d.roof==='gable'){const tg=triGeo(D+2*ov,R+ov*R/(D/2),W+2*ov);tg.rotateY(Math.PI/2);edges(tg,top-ov*R/(D/2));}
  else if(d.roof==='hip'){const pg=pyramidGeo();pg.scale(W+2*ov,R,D+2*ov);edges(pg,top);}
  else if(d.roof==='shed'){const s=R/D,tg=triGeo(D+2*ov,R+2*ov*s,W+2*ov,1);tg.rotateY(Math.PI/2);edges(tg,top-ov*s);}
  else edges(new THREE.BoxGeometry(W,.5,D),top+.25);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),bpFill);fl.rotation.x=-Math.PI/2;fl.position.y=.03;g.add(fl);
  const door=new THREE.Mesh(new THREE.PlaneGeometry(.9,.5),new THREE.MeshBasicMaterial({color:0xF4B400}));door.rotation.x=-Math.PI/2;door.position.set(-W/4,.04,D/2+.35);g.add(door);
  const plot=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(5.9,5.9)),new THREE.LineBasicMaterial({color:0xF4B400}));plot.rotation.x=-Math.PI/2;plot.position.y=.03;g.add(plot);
  return g;}
function drawBlueprint(P){if(P.bp)P.g.remove(P.bp);P.bp=blueprintGroup(P);P.g.add(P.bp);P.g.rotation.y=P.rot;}

/* 비계 */
function buildScaffold(P,d,top){const g=new THREE.Group();P.g.add(g);const hx=d.W/2+.62,hz=d.D/2+.62,pl=M({color:0xC8963E});
  const poles=perim(hx,hz,1.4).map(([x,z])=>{const r=hide(rod(V(x,0,z),V(x,top,z),.035,matSteelG,6));g.add(r);return r;});
  const levels=[],c=[[-hx,-hz],[hx,-hz],[hx,hz],[-hx,hz]];
  for(let y=1.3;y<top-.2;y+=1.3){const lv=[];for(let q=0;q<4;q++){const a=c[q],b=c[(q+1)%4];
    const l=hide(link(V(a[0],y+.5,a[1]),V(b[0],y+.5,b[1]),.05,.05,matSteelG));const p=hide(link(V(a[0],y,a[1]),V(b[0],y,b[1]),.42,.04,pl));g.add(l,p);lv.push(p,l);}levels.push(lv);}
  return {g,poles,levels};}

  const steps=[
  {n:'측량과 규준틀 설치',tools:['레벨(측량기)','줄자','말뚝','실'],d:'땅 높이를 재고, 말뚝과 실로 집이 들어설 자리를 땅 위에 그대로 표시해요. 나무가 있으면 먼저 옮겨요.',run:async()=>{
    if(P.bp){const bp=P.bp;P.bp=null;vanish(bp,400);}

    const ex=W/2+.55,ez=D/2+.55;s.stakes=[];

    await stagger(s.stakes,70,m=>growY(m,350));await stagger(s.str,200,m=>growZ(m,600));}},
  {n:'터파기',tools:['굴착기(포클레인)','덤프트럭'],d:'기초가 들어갈 깊이만큼 땅을 파내요. 파낸 흙은 옆에 쌓았다가 나중에 다시 메워요.',run:async()=>{

  {n:'잡석 다짐과 버림 콘크리트',tools:['잡석(자갈)','콤팩터(다짐기)','흙손'],d:'파낸 바닥에 자갈을 깔고 기계로 꾹꾹 다져요. 그 위에 얇게 콘크리트를 부어 평평한 작업 바닥을 만들어요.',run:async()=>{

  {n:'철근 배근',tools:['철근','결속선','철근 커터'],d:slabType==='mat'?'바닥 전체에 철근을 바둑판처럼 엮어요. 철근이 뼈대가 되어 콘크리트가 갈라지지 않게 잡아 줘요.':'벽이 올라갈 자리를 따라 띠 모양으로 철근을 엮어요.',run:async()=>{

      for(let x=-W/2+.12;x<=W/2-.1;x+=.3)bars.push(A(link(V(x,y+.03,-D/2+.08),V(x,y+.03,D/2-.08),r,r,rebarM,true)));}

    await stagger(bars,50,m=>growZ(m,400));}},
  {n:'거푸집 설치',tools:['거푸집(합판)','망치','못','수평자'],d:'콘크리트를 부을 틀을 짜요. 콘크리트는 이 틀 모양 그대로 굳어요.',run:async()=>{
    s.forms=[A(box(W+.12,F+.12,.04,plyM,0,0,D/2+.04)),A(box(W+.12,F+.12,.04,plyM,0,0,-D/2-.04)),A(box(.04,F+.12,D+.12,plyM,-W/2-.04,0,0)),A(box(.04,F+.12,D+.12,plyM,W/2+.04,0,0))];

  {n:'콘크리트 타설',tools:['레미콘 트럭','콘크리트 펌프카','진동기'],d:'레미콘 트럭이 싣고 온 콘크리트를 거푸집에 부어요. 진동기로 흔들어 빈틈을 없애요.',run:async()=>{

      await stagger(s.strips,250,m=>growY(m,700));s.slab=A(box(W-2*sw,.14,D-2*sw,concM,0,F-.14,0));await growXZ(s.slab,800);}

  {n:'양생과 거푸집 해체',tools:['양생 비닐','물 뿌리개'],d:'콘크리트가 단단히 굳도록 며칠 동안 물을 뿌리며 기다려요(양생). 다 굳으면 거푸집을 떼고 파낸 흙을 다시 메워요.',run:async()=>{

  if(o.found==='pile')steps.splice(2,0,{n:'말뚝 박기',tools:['항타기','콘크리트 말뚝'],d:'무른 흙 아래 단단한 땅까지 긴 콘크리트 말뚝을 두드려 박아요. 깊은 곳의 단단한 땅이 집 무게를 받쳐 줘요.',run:async()=>{

function frameSteps(P){const d=dims(P),{W,D,H,F,t,floors,R,ov}=d,st=P.ch.frame,A=m=>{P.g.add(m);m.visible=false;return m;};
  const C={rc:{c:0xB3B1AA,s:.22,sp:2.2,bh:.24},wood:{c:0xD9B27C,s:.09,sp:.6,bh:.14},steel:{c:0xA4462F,s:.16,sp:2.2,bh:.22},brick:{c:0xB5553C,s:.24,sp:1.1,bh:.2}}[st];
  const fm=st==='brick'?TM(TX.brick('#B5553C'),1):M({color:C.c,metalness:st==='steel'?.35:0,roughness:st==='steel'?.5:.85});P.mats.frame=fm;
  const slabM=M({color:0xB8B6AE});P.mats.slab=slabM;
  const beamM=st==='brick'?slabM:fm,woodM=st==='steel'?fm:M({color:0xD9B27C});P.mats.rafter=woodM;
  const Ytop=F+floors*H;P.Ytop=Ytop;const hx=W/2-t/2,hz=D/2-t/2,pts=perim(hx,hz,C.sp),info=FRAME_INFO[st];
  const s={},steps=[];const useCrane=st==='rc'||st==='steel';
  steps.push({n:'비계 설치',tools:['비계 파이프','발판','안전망'],d:'높은 곳에서 안전하게 일할 수 있도록 집 둘레에 철제 파이프로 발판(비계)을 세워요.',run:async()=>{
    if(useCrane){s.cr=crane(Ytop+R+2.4);s.cr.position.set(W/2+2.3,0,-D/2-1.6);P.g.add(s.cr);await pop(s.cr,600);}

    for(const lv of sc.levels)await stagger(lv,40,m=>pop(m,300));}});
  for(let k=0;k<floors;k++){const y=F+k*H,fl=k+1;
    steps.push({n:st==='brick'?`${fl}층 벽 쌓기`:`${fl}층 기둥 세우기`,tools:info.tools,d:info.d,run:async()=>{
      if(st==='wood'){const sills=[[-hx,-hz,hx,-hz],[hx,-hz,hx,hz],[hx,hz,-hx,hz],[-hx,hz,-hx,-hz]].map(([a,b,c,e])=>A(link(V(a,y+.04,b),V(c,y+.04,e),.14,.08,fm)));await stagger(sills,120,m=>growXZ(m,400));}
      const posts=pts.map(([x,z])=>A(box(C.s,H-C.bh,st==='wood'?.14:C.s,fm,x,y,z)));

      await stagger(posts,st==='wood'?45:st==='brick'?90:160,m=>growY(m,st==='brick'?900:450));}});
    steps.push({n:st==='brick'?`${fl}층 테두리보 두르기`:`${fl}층 보 올리기`,tools:st==='wood'?['깔도리','못총']:st==='brick'?['거푸집','철근','레미콘']:['보','크레인','볼트'],
      d:st==='brick'?'쌓은 벽 맨 위를 콘크리트 띠(테두리보)로 한 바퀴 둘러 벽이 벌어지지 않게 묶어요.':'기둥 머리를 가로 부재(보)로 이어 서로 붙잡게 해요. 보는 위층 바닥과 지붕의 무게를 기둥에 전해요.',run:async()=>{
      const c=[[-hx,-hz],[hx,-hz],[hx,hz],[-hx,hz]],beams=[];
      for(let q=0;q<4;q++){const a=c[q],b=c[(q+1)%4];beams.push(A(link(V(a[0]*1.03,y+H-C.bh/2,a[1]*1.03),V(b[0]*1.03,y+H-C.bh/2,b[1]*1.03),C.s,C.bh,beamM)));}
      await stagger(beams,200,m=>drop(m,550,2));}});
    if(k<floors-1)steps.push({n:`${fl+1}층 바닥 만들기`,tools:st==='wood'?['장선','합판','못총']:['데크 플레이트','철근','레미콘'],
      d:st==='wood'?'장선(바닥 받침 나무)을 40cm 간격으로 걸치고 그 위에 합판을 깔아 위층 바닥을 만들어요.':'강철판(데크)을 깔고 철근을 엮은 뒤 콘크리트를 부어 위층 바닥(슬래브)을 만들어요.',run:async()=>{

      const my=(ey+Ytop+R)/2-.12;

<script>

function exteriorSteps(P){const d=dims(P),{W,D,H,F,t,floors,R,ov}=d,o=P.ch,Ytop=P.Ytop,A=m=>{P.g.add(m);m.visible=false;return m;};

  const glass=M({color:0x9EC9E6,transparent:true,opacity:.45,roughness:.1,metalness:.2});P.mats.glass=glass;
  const plyM=TM(TX.ply(),1);P.mats.sheath=plyM;const panes=WINDOW[o.window].panes;
  P.walls=[];
  for(let k=0;k<floors;k++)for(const sd of wallSides(d)){const grp=new THREE.Group();grp.position.set(sd.x,F+k*H,sd.z);grp.rotation.y=sd.ry;P.g.add(grp);

      const ti=new THREE.Mesh(triGeo(D-.02,R,t*.45,ap),insM),tf=new THREE.Mesh(triGeo(D-.02,R,t,ap),wm);
      [ti,tf].forEach(m=>{m.position.y=H;m.castShadow=m.receiveShadow=true;});ins.add(ti);fin.add(tf);}
    if(top&&sd.side==='back'&&d.roof==='shed'){ins.add(box(sd.L,R,t*.45,insM,0,H,0));fin.add(box(sd.L,R,t,wm,0,H,0,0,H));}
    ins.children.forEach(hide);fin.children.forEach(hide);grp.add(ins,fin);
    const wins=ops.map(op=>{const m=hide(openingMesh(op,t,frM,glass,doorM,panes));grp.add(m);return m;});
    P.walls.push({grp,L:sd.L,ops,k,side:sd.side,ins,fin,wins});}
  const X=V(1,0,0);
  const steps=[
  {n:`단열재 붙이기: ${INSUL[o.insul].name}`,tools:[INSUL[o.insul].name+' 단열재','투습 방수지','타카'],
   d:`벽에 ${INSUL[o.insul].name} 단열재를 빈틈없이 대서 여름엔 더위, 겨울엔 추위가 들어오지 않게 해요. ${INSUL[o.insul].desc}예요.`,run:async()=>{

    const all=P.walls.flatMap(w=>w.wins);await stagger(all,120,m=>pop(m,420));

      await stagger(cap,100,m=>pop(m,300));const pipe=A(rod(V(W/2+.08,0,-D/2+.3),V(W/2+.08,Ytop+.1,-D/2+.3),.06,matSteelG));await growY(pipe,600);}});
    steps.push({n:`옥상 마감: ${RM.name}`,tools:ROOF_TOOLS[o.roofM],d:ROOF_DESC[o.roofM],run:async()=>{const y=Ytop+.03,w=W-.4,dd=D-.4;
      if(o.roofM==='green'){const soil=A(box(w,.12,dd,matSoil,0,y,0));await growY(soil,700);const gm=TM(TX.grass(),2);P.mats.roof=gm;const gr=A(box(w,.03,dd,gm,0,y+.12,0));await growX(gr,900);
        const sh=[];for(const [x,z] of[[-w/3,-dd/4],[w/4,dd/5],[w/3,-dd/4],[-w/6,dd/4]]){const m=A(new THREE.Mesh(new THREE.IcosahedronGeometry(.28,0),matLeaf));m.position.set(x,y+.35,z);m.castShadow=true;sh.push(m);}

        const sm=TM(TX.solar(),1,{roughness:.3,metalness:.3}),pn=[];for(let x=-w/2+.6;x<=w/2-.5;x+=1.15)for(const z of[-dd/4,dd/4]){const m=A(box(1.0,.05,.7,sm,x,y+.25,z));m.rotation.x=-.35;pn.push(m);}

      if(planes.length){const sh=planes.map(sg=>{const {a,b}=roofLine(d,Ytop,sg),n=X.clone().cross(b.clone().sub(a).normalize());

      else{const sl=R/(D/2),ey=Ytop-ov*sl,g=pyramidGeo();g.scale(W+2*ov+.04,Ytop+R-ey,D+2*ov+.04);const m=A(new THREE.Mesh(g,plyM));m.position.y=ey+.08;m.castShadow=true;await growY(m,1100);}}});
    steps.push({n:`지붕 마감: ${RM.name}`,tools:ROOF_TOOLS[o.roofM],d:ROOF_DESC[o.roofM],run:async()=>{

function setCut(P,on){P.cut=on;['wall','insul','roof','roofHip','sheath','paper','membrane'].forEach(k=>{const m=P.mats[k];if(!m)return;
  m.transparent=on;m.opacity=on?(k==='paper'?.4:.12):1;m.depthWrite=!on;m.needsUpdate=true;});}
const FLOOR_TOOLS={wood:['원목 마루','고무 망치','톱'],tile:['타일','접착 몰탈','줄눈재'],vinyl:['장판','칼','본드']};

  return [
  {n:'집 안 들여다보기',tools:['투시 보기'],d:'외벽과 지붕을 잠깐 투명하게 해서 집 안에서 벌어지는 공사를 살펴봐요. 완공 뒤에도 [살펴보기]에서 다시 볼 수 있어요.',run:async()=>{
    setCut(P,true);await wait(700);}},
  {n:'전기 배선',tools:['전선','전선관(CD관)','콘센트·스위치 상자','분전함'],d:'벽과 천장 속으로 전선관을 지나가게 하고 그 안에 전선을 넣어요. 콘센트와 스위치 자리에는 상자를 달아요.',run:async()=>{
    const runs=[],drops=[],boxes=[];
    ys.forEach(y=>{const yt=y+H-.35,c=[[-xi+.03,-zi+.03],[xi-.03,-zi+.03],[xi-.03,zi-.03],[-xi+.03,zi-.03]];
      for(let q=0;q<4;q++){const a=c[q],b=c[(q+1)%4];runs.push(A(link(V(a[0],yt,a[1]),V(b[0],yt,b[1]),.03,.03,cableM,true)));}
      [[W/8,zi-.03],[0,-zi+.03],[-xi+.03,0],[xi-.03,.3]].forEach(([x,z])=>{drops.push(A(link(V(x,yt,z),V(x,y+.35,z),.03,.03,cableM,true)));boxes.push(A(box(.14,.16,.14,matWhite,x,y+.26,z)));});});
    boxes.push(A(box(.12,.5,.36,M({color:0x8E959C}),-xi+.06,y0+1.3,zi-.7)));
    await stagger(runs,150,m=>growZ(m,500));await stagger(drops,80,m=>growZ(m,400));await stagger(boxes,60,m=>pop(m,300));}},
  {n:'급수·배수 배관',tools:['급수관(찬물·더운물)','PVC 배수관','파이프 렌치'],d:'파란 관으로 찬물, 빨간 관으로 더운물이 들어와요. 쓰고 난 물은 굵은 회색 배수관을 타고 밖으로 흘러 나가요.',run:async()=>{
    const y=y0,p=[];
    p.push(A(rod(V(xi-.12,y-.3,-zi+.08),V(xi-.12,y+1.0,-zi+.08),.03,cold)),A(rod(V(xi-.12,y+1.0,-zi+.08),V(xi-1.25,y+1.0,-zi+.08),.03,cold)));
    p.push(A(rod(V(xi-.12,y-.3,-zi+.17),V(xi-.12,y+1.12,-zi+.17),.03,hot)),A(rod(V(xi-.12,y+1.12,-zi+.17),V(xi-1.25,y+1.12,-zi+.17),.03,hot)));
    p.push(A(rod(V(xi-.1,y-.3,zi-.85),V(xi-.1,y+.8,zi-.85),.03,cold)),A(rod(V(xi-.1,y-.3,zi-1.0),V(xi-.1,y+.8,zi-1.0),.03,hot)));
    p.push(A(rod(V(xi-.35,y-.5,-zi+.7),V(xi-.35,y+.12,-zi+.7),.06,drainM)),A(rod(V(xi-1.1,y-.5,-zi+.3),V(xi-1.1,y+.12,-zi+.3),.06,drainM)),A(rod(V(xi-.35,y-.5,zi-.9),V(xi-.35,y+.12,zi-.9),.05,drainM)));
    await stagger(p,160,m=>growY(m,500));}},
  {n:`난방 설치: ${HEAT[o.heat].name}`,tools:HS.tools,d:HS.d,run:async()=>{
    const eq=[];
    if(o.heat==='heatpump'){const u=A(box(.38,.7,.85,matWhite,W/2+.5,0,-D/4));const fan=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.03,16),matDark);fan.rotation.z=Math.PI/2;fan.position.set(.2,.38,0);u.add(fan);eq.push(u,A(rod(V(W/2+.3,.4,-D/4),V(xi-.05,y0+.4,-D/4),.03,pexM)));}
    else if(o.heat==='solarth'){const cm=TM(TX.solar(),1,{roughness:.35,metalness:.3});
      if(d.roof==='flat'){const m=A(box(1.3,.06,.9,cm,-W/4,Ytop+.45,0));m.rotation.x=-.5;eq.push(m);}
      else if(d.roof==='hip'){const m=A(box(1.2,.06,.8,cm,0,Ytop+R*.45,D/2*.55));m.rotation.x=Math.atan(R/(D/2));eq.push(m);}
      else{const {a,b}=roofLine(d,Ytop,1),dir=b.clone().sub(a),L=dir.length();dir.normalize();const n=V(1,0,0).cross(dir);
        eq.push(A(link(a.clone().addScaledVector(dir,L*.2).addScaledVector(n,.25).setX(-W/4),a.clone().addScaledVector(dir,L*.55).addScaledVector(n,.25).setX(-W/4),1.3,.06,cm)));}
      eq.push(A(box(.45,.9,.45,matWhite,-xi+.4,y0+.08,-zi+.35)));}
    else eq.push(A(box(.45,.65,.3,matWhite,-xi+.45,y0+1.15,-zi+.17)));
    eq.push(A(box(.5,.12,.1,M({color:0xC9A443,metalness:.5}),-xi+.45,y0+.1,-zi+.1)));
    await stagger(eq,250,m=>pop(m,450));
    const tubes=ys.map(y=>{const pts=[];let r=0;for(let z=-zi+.2;z<=zi-.15;z+=.28,r++){const a=-xi+.2,b=xi-.2;pts.push(V(r%2?b:a,y+.035,z),V(r%2?a:b,y+.035,z));}
      const cv=new THREE.CatmullRomCurve3(pts,false,'centripetal');return A(new THREE.Mesh(new THREE.TubeGeometry(cv,pts.length*24,.022,5,false),pexM));});
    for(const m of tubes)await drawTube(m,2600);}},
  {n:'방바닥 미장 (방통)',tools:['몰탈','몰탈 펌프','미장 흙손'],d:'배관 위에 몰탈을 부어 평평하게 덮어요. 몰탈이 열을 머금고 있어 바닥이 오래 따뜻해요.',run:async()=>{
    const ms=ys.map(y=>A(box(2*xi,.075,2*zi,mortM,0,y,0)));await stagger(ms,300,m=>growY(m,1300));}},
  {n:'석고보드와 도배',tools:['석고보드','도배풀','도배솔'],d:'벽에 석고보드를 붙여 매끈하게 한 뒤 고른 벽지를 발라요. 욕실은 칸막이벽을 세워 나눠요.',run:async()=>{
    const pw=[A(box(.1,H-.25,1.4,paperM,xi-1.4,y0+.08,-zi+.7)),A(box(.7,H-.25,.1,paperM,xi-.35,y0+.08,-zi+1.4))];
    const papers=P.walls.map(w=>{const g=wallBoxes(w.L,H-.02,.012,w.ops,paperM,-t/2-.008);g.children.forEach(hide);w.grp.add(g);return g;});
    await stagger(pw,200,m=>growY(m,500));await stagger(papers,120,g=>stagger(g.children,30,m=>growY(m,500)));}},
  {n:`바닥재 시공: ${FM.name}`,tools:FLOOR_TOOLS[o.floor],d:o.floor==='wood'?'마루판의 홈과 턱을 서로 끼워 맞추며 한쪽 벽부터 깔아요.':o.floor==='tile'?'접착 몰탈을 바르고 타일을 줄 맞춰 붙인 뒤 틈을 줄눈재로 메워요.':'장판을 방 크기에 맞게 잘라 한 장으로 깔아요. 온돌 열이 잘 전해져요.',run:async()=>{
    const fs=ys.map(y=>A(box(2*xi,.02,2*zi,flM,0,y+.075,0)));await stagger(fs,300,m=>growX(m,1200));}},
  {n:'조명과 가구 들이기',tools:['LED 조명','드라이버','가구'],d:'천장에 조명을 달고 불을 켜 봐요. 가구를 들여놓으면 사람이 살 수 있는 집이 돼요.',run:async()=>{
    const lamps=[];ys.forEach(y=>[-W/4,W/4].forEach(x=>{const l=A(new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.06,16),lampM));l.position.set(x,y+H-.3,0);lamps.push(l);}));
    await stagger(lamps,120,m=>pop(m,350));await tw(700,p=>lampM.emissiveIntensity=p);
    const fb=y0+.095,wd=M({color:0x9A6B45}),sofa=M({color:0x5B7FA6}),tbl=M({color:0xB98B5C}),bed=M({color:0xF4F1EA}),f=[];
    f.push(A(box(1.4,.4,.55,sofa,-.1,fb,zi-.38)),A(box(1.4,.35,.14,sofa,-.1,fb+.4,zi-.12)),A(box(.8,.32,.5,tbl,-.1,fb,zi-1.15)));
    f.push(A(box(.55,.85,1.3,matWhite,xi-.3,fb,zi-.9)),A(box(.66,.5,1.25,matWhite,xi-.36,fb,-zi+.66)),A(box(.34,.4,.45,matWhite,xi-1.1,fb,-zi+.3)));
    const bedAt=(x,y)=>{f.push(A(box(1.0,.3,1.9,wd,x,y,-zi+1.0)),A(box(.95,.14,1.85,bed,x,y+.3,-zi+1.0)),A(box(.6,.1,.3,matWhite,x,y+.44,-zi+.3)));};
    if(floors===1)bedAt(-xi+.58,fb);
    const st=[],rise=H/12;
    for(let k=1;k<floors;k++){const y1=ys[k]+.095;bedAt(xi-.58,y1);f.push(A(box(.9,.72,.5,tbl,xi-.52,y1,zi-.32)));
      for(let q=0;q<12;q++)st.push(A(box(.85,rise*(q+1),.26,wd,-xi+.45,ys[k-1]+.08,zi-.14-q*.26)));}
    await stagger(st,50,m=>growY(m,300));await stagger(f,90,m=>drop(m,500,1.4));}},
  {n:'준공 검사',tools:['점검표','수평자','누수 점검'],d:'기울지 않았는지, 물이 새지 않는지, 전기가 안전한지 하나하나 점검해요. 통과하면 입주할 수 있어요!',run:async()=>{
    setCut(P,false);await wait(600);}}];}
</script>
<script>
/* ================= 도로 ================= */
const planGroup=new THREE.Group();scene.add(planGroup);
const planMat=new THREE.MeshBasicMaterial({color:0xF4B400,transparent:true,opacity:.55,depthWrite:false});
const workMat=new THREE.MeshBasicMaterial({color:0xF4B400,transparent:true,opacity:.28,depthWrite:false});
function canRoad(i,j){return inMap(i,j)&&(grid[i][j]===null||grid[i][j]==='tree');}
const isRoadish=(i,j,extra)=>inMap(i,j)&&(grid[i][j]==='road'||grid[i][j]==='road-work'||grid[i][j]==='bridge'||grid[i][j]==='bridge-work'||(extra&&extra.some(t=>t[0]===i&&t[1]===j)));
function newRoad(tiles,entry=false){const G=new THREE.Group();addW(G);
  const R={id:++state.nextId,type:'road',tiles:tiles.map(t=>[...t]),stage:0,mat:null,walk:false,trees:false,lamp:false,entry,qz:{},qw:{},g:G,s:{},spent:0};
  tiles.forEach(([i,j])=>{if(grid[i][j]==='tree')R.s.hadTree=(R.s.hadTree||[]).concat([[i,j]]);grid[i][j]='road-work';owner[i][j]=R;});
  R.marks=tiles.map(([i,j])=>{const [x,z]=tc(i,j);const m=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.8),workMat);m.rotation.x=-Math.PI/2;m.position.set(x,.05,z);G.add(m);return m;});
  return R;}
function roadPhaseSteps(R,k){const G=R.g,A=m=>{G.add(m);m.visible=false;return m;},tiles=R.tiles,s=R.s;
  const path=tiles.map(([i,j])=>{const [x,z]=tc(i,j);return V(x,0,z);});
  const per=Math.min(420,5000/Math.max(1,tiles.length));
  async function drive(m,ms,y=0){G.add(m);m.position.copy(path[0]).setY(y);await pop(m,300);const seg=Math.max(1,path.length-1);
    await tw(ms,p=>{const f=p*seg,q=Math.min(seg-1,Math.floor(f)),u=f-q,a=path[q],b=path[Math.min(path.length-1,q+1)];
      m.position.lerpVectors(a,b,u);m.position.y=y;if(a.distanceTo(b)>.01)m.rotation.y=Math.atan2(-(b.z-a.z),b.x-a.x);if(m.userData.drum)m.userData.drum.rotation.y+=.2;},lin);
    await vanish(m,300);}
  if(k===0)return [
    {n:'측량과 말뚝 박기',tools:['측량기','말뚝','페인트 스프레이'],d:'도로가 지나갈 자리와 높이를 재고 말뚝으로 표시해요. 길 위의 나무는 옮겨 심어요.',run:async()=>{
      await Promise.all(tiles.map(([i,j])=>clearTree(i,j)));tiles.forEach(([i,j])=>{grid[i][j]='road-work';});
      s.stakes=[];const wood=M({color:0xC49A63});tiles.forEach(([i,j])=>{const [x,z]=tc(i,j);s.stakes.push(A(box(.07,.5,.07,wood,x-.9,0,z-.9)),A(box(.07,.5,.07,wood,x+.9,0,z+.9)));});
      await stagger(s.stakes,per/3,m=>growY(m,300));}},
    {n:'흙 밀고 고르기',tools:['불도저','굴착기'],d:'불도저가 앞의 큰 날로 흙을 밀어 높은 곳은 깎고 낮은 곳은 메워 평평하게 골라요.',run:async()=>{
      R.marks.forEach(m=>m.visible=false);const soilM=M({color:0x7A5B3E});
      const ss=tiles.map(([i,j])=>{const [x,z]=tc(i,j);return A(box(2,.02,2,soilM,x,.006,z));});
      await Promise.all([stagger(ss,per,m=>growXZ(m,400)),drive(bulldozer(),per*tiles.length+400)]);}}];
  if(k===1)return [
    {n:'자갈 깔기',tools:['덤프트럭','모터 그레이더'],d:'덤프트럭이 부순 돌(자갈)을 쏟아 붓고, 그레이더가 고르게 펴요.',run:async()=>{
      const gm=TM(TX.gravel(),.8);s.grav=tiles.map(([i,j])=>{const [x,z]=tc(i,j);return A(box(2,.05,2,gm,x,.02,z));});await stagger(s.grav,per,m=>growY(m,400));}},
    {n:'롤러로 다지기',tools:['로드롤러'],d:'무거운 쇠 바퀴로 자갈을 여러 번 눌러 단단하게 다져요. 이 층(노반)이 차 무게를 넓게 나눠 땅이 꺼지지 않게 해요.',run:async()=>{
      await drive(roller(),per*tiles.length+500);}}];
  if(k===2){const pv=R.mat,surfM=TM(TX[ROADMAT[pv].tx](),pv==='block'?1:2);return [
    {n:pv==='block'?'보도블록 깔기':`${ROADMAT[pv].name} 포장`,tools:pv==='asphalt'?['아스팔트 피니셔','로드롤러']:pv==='concrete'?['레미콘','콘크리트 피니셔','흙손']:['보도블록','모래','고무 망치'],
     d:pv==='asphalt'?'뜨겁게 녹인 아스팔트를 피니셔로 고르게 펴고, 식기 전에 롤러로 눌러 매끈하게 해요.':pv==='concrete'?'콘크리트를 부어 평평하게 편 뒤 굳혀요. 금이 가지 않도록 일정한 간격으로 줄눈을 넣어요.':'모래를 고르게 편 뒤 블록을 한 장씩 맞춰 깔고 틈에 모래를 채워요.',run:async()=>{
      const sf=tiles.map(([i,j])=>{const [x,z]=tc(i,j);return A(box(2,.05,2,surfM,x,.07,z));});
      await Promise.all([stagger(sf,per,m=>growX(m,450)),pv==='block'?Promise.resolve():drive(paver(),per*tiles.length+400,.12)]);
      if(pv==='asphalt')await drive(roller(),per*tiles.length*.6+400,.12);}}];}
  const edgesOf=(i,j)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>!isRoadish(i+a,j+b,tiles));
  return [
    {n:R.mat==='block'?'경계석 놓기':'차선 그리기',tools:R.mat==='block'?['경계석','고무 망치']:['차선 도색기','유리알 페인트'],d:R.mat==='block'?'길 가장자리에 경계석을 놓아 블록이 밀리지 않게 해요.':'가운데 노란 중앙선을 그려요. 페인트 속 작은 유리알이 밤에 빛을 반사해 잘 보여요.',run:async()=>{
      const ls=[],lineY=M({color:0xF2C230}),curb=M({color:0xC9C6BE});
      tiles.forEach(([i,j])=>{const [x,z]=tc(i,j);grid[i][j]='road';
        if(R.mat==='block'){edgesOf(i,j).forEach(([a,b])=>ls.push(A(box(a?.12:2,.1,a?2:.12,curb,x+a*.94,.1,z+b*.94))));return;}
        const h=isRoadish(i-1,j,tiles)||isRoadish(i+1,j,tiles),v=isRoadish(i,j-1,tiles)||isRoadish(i,j+1,tiles);if(h&&v)return;
        if(v&&!h)[-.5,.5].forEach(o=>ls.push(A(box(.08,.012,.55,lineY,x,.12,z+o))));else[-.5,.5].forEach(o=>ls.push(A(box(.55,.012,.08,lineY,x+o,.12,z))));});
      await stagger(ls,per/2,m=>growXZ(m,250));}},
    {n:'안전 시설 설치',tools:[R.walk&&'인도 블록',R.trees&&'가로수',R.lamp&&'가로등','말뚝 뽑기'].filter(Boolean),d:(R.walk||R.trees||R.lamp)?'고른 안전 시설을 길가에 설치하고, 측량 말뚝을 뽑아 공사를 마무리해요.':'측량 말뚝을 뽑아 공사를 마무리해요. 안전 시설이 없으면 사람이 걷기엔 조금 위험해요.',run:async()=>{
      const walkM=M({color:0xD5D3CB}),it=[],pole=M({color:0x4B5157});R.lampMats=R.lampMats||[];const lampM=M({color:0xffffff,emissive:0xFFE3A0,emissiveIntensity:night?1.6:0});R.lampMat=lampM;
      tiles.forEach(([i,j],q)=>{const [x,z]=tc(i,j);const ed=edgesOf(i,j);
        if(R.walk)ed.forEach(([a,b])=>it.push(A(box(a?.38:2,.06,a?2:.38,walkM,x+a*.81,.12,z+b*.81))));
        const e=ed[0];if(!e)return;const px=x+e[0]*.8+(e[1]?.55:0),pz=z+e[1]*.8+(e[0]?.55:0);
        if(R.trees&&q%2===0){const t=makeTree(px,pz,.55);t.position.y=.12;G.add(t);t.visible=false;it.push(t);R.treeCount=(R.treeCount||0)+1;}
        if(R.lamp&&q%2===1){const l=A(rod(V(px,.12,pz),V(px,1.5,pz),.035,pole,6));const h=A(box(.26,.07,.26,lampM,px,1.5,pz));it.push(l,h);}});
      await stagger(it,Math.min(120,3000/Math.max(1,it.length)),m=>pop(m,350));
      await Promise.all((s.stakes||[]).map(m=>vanish(m,250)));R.marks.forEach(m=>G.remove(m));}}];}

/* ================= 다리 ================= */
function bridgeSpan(i,j){if(!inMap(i,j)||i<RIVER0-1||i>RIVER1+1)return null;return {j,tiles:[...Array(RIVER1-RIVER0+3)].map((_,k)=>[RIVER0-1+k,j])};}
function canBridge(sp){return sp&&sp.tiles.every(([i,j])=>{const g=grid[i][j];return i>=RIVER0&&i<=RIVER1?g==='river':(g===null||g==='tree'||g==='road');});}
function newBridge(sp){const zc=tc(0,sp.j)[1],G=new THREE.Group();G.position.set(RCX,0,zc);addW(G);
  const B={id:++state.nextId,type:'bridge',j:sp.j,tiles:sp.tiles,stage:0,btype:null,color:null,qz:{},qw:{},g:G,s:{},z:zc,spent:0,
    mats:{steel:M({color:0x8E949A,metalness:.35,roughness:.5}),lamp:M({color:0xffffff,emissive:0xFFE3A0,emissiveIntensity:0})}};
  sp.tiles.forEach(([i,j])=>{if(grid[i][j]!=='road'){owner[i][j]=B;grid[i][j]='bridge-work';}});
  B.marks=sp.tiles.map(([i,j])=>{const [x]=tc(i,j);const m=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.8),workMat);m.rotation.x=-Math.PI/2;m.position.set(x-RCX,.06,0);G.add(m);return m;});
  return B;}
const DT=.09,DB=DT-.3,HW=1.0,AB=3.2,GB=DB-.4;
function bridgePhaseSteps(B,k){const G=B.g,A=m=>{G.add(m);m.visible=false;return m;},ty=B.btype,s=B.s,stM=B.mats.steel;
  const conc=M({color:0xB9B7AF}),rust=M({color:0x8A4B2C,metalness:.3});
  const piers=ty==='girder'?[-1.1,1.1]:ty==='cable'?[0]:ty==='susp'?[-2.3,2.3]:[];
  const abTop=ty==='girder'?GB:DB;
  if(k===0)return [{n:piers.length?'가물막이와 기초 말뚝':'교대 기초 말뚝 박기',tools:['크레인','항타기(말뚝 박는 기계)','강철 널말뚝'],
    d:piers.length?'강물 속에 강철판을 빙 둘러 박아 물을 막고(가물막이), 그 안에서 땅속 깊이 말뚝을 박아 다리 기초를 만들어요.':'아치교는 강 가운데 교각이 없어요. 대신 양쪽 강둑에 말뚝을 깊이 박아 아치가 미는 힘을 버티게 해요.',run:async()=>{
    B.marks.forEach(m=>G.remove(m));await Promise.all(B.tiles.map(([i,j])=>clearTree(i,j)));
    const pd=piledriver();pd.position.set(-4.3,0,1.3);pd.rotation.y=Math.PI;G.add(pd);await pop(pd,400);

  if(k===1){const st=[{n:'교대와 교각 세우기',tools:['철근','거푸집','콘크리트 펌프카'],d:piers.length?'강둑 양쪽 끝에 교대를, 강 속에 교각을 콘크리트로 세워요. 교각은 다리 무게를 강바닥으로 전하는 기둥이에요.':'강둑 양쪽 끝에 튼튼한 교대를 콘크리트로 만들어요.',run:async()=>{
    const ab=[-AB,AB].map(x=>A(box(1.0,abTop-BED,2.3,conc,x,BED,0)));await stagger(ab,300,m=>growY(m,900));

      await growY(ft,400);await growY(col,900);if(ty==='girder'){const cap=A(box(.7,.25,2.2,conc,x,GB-.25,0));await drop(cap,400,1);}}}}];
    if(ty==='cable')st.push({n:'주탑 세우기',tools:['오르는 거푸집','타워크레인','레미콘'],d:'강 가운데 교각 위에 높은 주탑을 세워요. 거푸집을 한 층씩 위로 옮기며 콘크리트를 부어 올라가요.',run:async()=>{
      const pk=[-1.2,1.2].map(z=>A(box(.3,5.4-DB,.3,stM,0,DB,z)));await Promise.all(pk.map(m=>growY(m,1800)));
      const xb=[A(box(.3,.3,2.7,stM,0,4.3,0)),A(box(.3,.25,2.7,stM,0,DB-.25,0))];await stagger(xb,200,m=>pop(m,400));}});
    if(ty==='susp')st.push({n:'주탑과 앵커 블록',tools:['오르는 거푸집','타워크레인','레미콘'],d:'강 속 교각 위에 주탑 두 개를 세우고, 양쪽 강둑에는 케이블 끝을 붙잡을 무거운 콘크리트 덩어리(앵커 블록)를 만들어요.',run:async()=>{

  if(k===2){
    if(ty==='girder')return [
      {n:'거더 밀어 넣기',tools:['강철 거더','유압 잭','대형 크레인'],d:'공장에서 만든 길쭉한 강철 거더를 강둑에서 교각 위로 조금씩 밀어 넣어 걸쳐요(압출 공법).',run:async()=>{

        await stagger(gs,500,m=>slideX(m,2200,-9));const cb=[];for(let x=-3;x<=3.01;x+=1.5)cb.push(A(box(.08,.3,1.24,stM,x,GB+.05,0)));await stagger(cb,80,m=>pop(m,300));}},
      {n:'상판 콘크리트 치기',tools:['거푸집','철근','레미콘'],d:'거더 위에 거푸집을 짜고 철근을 엮은 뒤 콘크리트를 부어 차가 달릴 상판을 만들어요.',run:async()=>{
