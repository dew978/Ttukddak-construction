      {n:'아치 세우기',tools:['크레인','용접기','임시 케이블'],d:'양쪽 강둑에서 둥근 아치를 조금씩 뻗어 나가 가운데에서 딱 맞춰요. 아치는 누르는 힘을 양쪽 땅으로 흘려보내요.',run:async()=>{
        const half=(s1,z)=>{const pts=[];for(let q=0;q<=16;q++){const x=s1*3.3*(1-q/16);pts.push(V(x,ay(x),z));}return A(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,.1,8,false),stM));};
        const hs=[half(-1,-HW+.05),half(1,-HW+.05),half(-1,HW-.05),half(1,HW-.05)];hs.forEach(m=>m.castShadow=true);await Promise.all(hs.map(m=>drawTube(m,2600)));
        const br=[0,-1.4,1.4].map(x=>A(link(V(x,ay(x),-HW+.05),V(x,ay(x),HW-.05),.08,.08,stM)));await stagger(br,120,m=>pop(m,300));}},
      {n:'행어 달고 상판 만들기',tools:['행어(매달기 줄)','거푸집','레미콘'],d:'아치에 가느다란 행어를 늘어뜨리고, 행어가 붙잡은 자리에 상판을 만들어요.',run:async()=>{
        const hg=[];for(let x=-2.7;x<=2.71;x+=.6)[-HW+.05,HW-.05].forEach(z=>hg.push(A(rod(V(x,DB,z),V(x,ay(x),z),.025,stM,6))));
        await stagger(hg,50,m=>growY(m,350));const dk=A(box(7.4,.3,2*HW,conc,0,DB,0));await growX(dk,1500);}}];}
    if(ty==='cable')return [{n:'상판 잇기와 케이블 걸기',tools:['이동식 거푸집','케이블','유압 잭'],d:'주탑 양쪽으로 상판을 한 칸씩 똑같이 뻗어 나가요. 한 칸마다 케이블을 걸어 주탑에 매달아요. 양쪽 무게가 같아야 기울지 않아요(균형 캔틸레버).',run:async()=>{
      const c0=A(box(1.0,.3,2*HW,conc,0,DB,0));await growX(c0,500);const segs=[[.5,1.3],[1.3,2.1],[2.1,2.9],[2.9,3.7]];
      for(let q=0;q<4;q++){const [a,b]=segs[q];const pair=[1,-1].map(sg=>A(box(b-a,.3,2*HW,conc,sg*(a+b)/2,DB,0)));await Promise.all(pair.map(m=>growX(m,450)));
        const cs=[];[1,-1].forEach(sg=>[-1.2,1.2].forEach(z=>cs.push(A(rod(V(0,5.1-q*.28,z),V(sg*(b-.15),DT,z*.85),.02,stM,5)))));await Promise.all(cs.map(m=>growY(m,450)));}}}];
    const cy=x=>{const ax=Math.abs(x);if(ax<=2.3)return DT+.75+(4.3-DT-.75)*Math.pow(x/2.3,2);return 4.3-(ax-2.3)/(4.7-2.3)*(4.3-.4);};
    return [
      {n:'메인 케이블 걸기',tools:['케이블 가설 장비','윈치'],d:'가느다란 철사 수천 가닥을 묶어 굵은 메인 케이블을 만들고, 앵커 블록에서 주탑 꼭대기를 넘어 반대편까지 걸어요.',run:async()=>{
        const mk=z=>{const pts=[];for(let q=0;q<=40;q++){const x=-4.7+9.4*q/40;pts.push(V(x,cy(x),z));}return A(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),120,.06,6,false),stM));};
        await Promise.all([mk(-1.2),mk(1.2)].map(m=>drawTube(m,2600)));}},
      {n:'행어 달고 상판 들어 올리기',tools:['행어','크레인 바지선','유압 잭'],d:'메인 케이블에 행어를 늘어뜨리고, 배로 싣고 온 상판 조각을 물 위에서 들어 올려 매달아요.',run:async()=>{
        const hg=[];for(let x=-2.0;x<=2.01;x+=.5)[-1.2,1.2].forEach(z=>hg.push(A(rod(V(x,DB,z*.85),V(x,cy(x),z),.02,stM,5))));await stagger(hg,40,m=>growY(m,350));
        const segs=[];for(let x=-3.7;x<3.69;x+=1.48)segs.push(A(box(1.48,.3,2*HW,conc,x+.74,DB,0)));
        await stagger(segs,280,m=>{const y=m.position.y;m.position.y=WATER-.2;m.visible=true;return tw(900,p=>m.position.y=WATER-.2+(y-WATER+.2)*p,easeOut);});}}];}
  return [
    {n:'강철 부분 칠하기',tools:['도장 스프레이','녹 방지 페인트'],d:'강철은 공기와 물에 닿으면 녹이 슬어요. 녹 방지 페인트를 먼저 칠하고 고른 색으로 마감해요.',run:async()=>{
      const c0=stM.color.clone(),c1=new THREE.Color(B.color);await tw(1800,p=>stM.color.lerpColors(c0,c1,p));}},
    {n:'포장·난간·가로등',tools:['아스팔트 피니셔','롤러','난간','가로등'],d:'상판 위를 아스팔트로 포장하고, 사람이 떨어지지 않게 난간을, 밤길을 밝힐 가로등을 달아요. 가물막이는 걷어 내요.',run:async()=>{
      const asp=TM(TX.asphalt(),2);const pv=A(box(10,.035,1.8,asp,0,DT-.01,0));await growX(pv,1200);
      [-1,1].forEach(sg=>{const ii=sg<0?RIVER0-1:RIVER1+1;if(grid[ii][B.j]!=='road'){const ap=A(box(1.3,.12,1.8,asp,sg*4.35,0,0));pop(ap,300);}});
      const rails=[];[-HW+.06,HW-.06].forEach(z=>{for(let x=-3.6;x<=3.61;x+=.6)rails.push(A(box(.05,.5,.05,stM,x,DT,z)));rails.push(A(link(V(-3.7,DT+.5,z),V(3.7,DT+.5,z),.06,.06,stM)),A(link(V(-3.7,DT+.28,z),V(3.7,DT+.28,z),.03,.03,stM)));});
      await stagger(rails,25,m=>growY(m,250));
      const ln=[];for(let x=-3.4;x<=3.41;x+=.8)ln.push(A(box(.45,.012,.07,M({color:0xF2C230}),x,DT+.025,0)));await stagger(ln,40,m=>growX(m,200));
      const lamps=[];[[-2,-HW+.06],[2,HW-.06],[-2,HW-.06],[2,-HW+.06]].forEach(([x,z])=>{lamps.push(A(rod(V(x,DT,z),V(x,DT+1.3,z),.035,matDark,6)),A(box(.3,.08,.16,B.mats.lamp,x,DT+1.3,z*.85)));});
      await stagger(lamps,100,m=>growY(m,300));await Promise.all((s.cof||[]).map(m=>vanish(m,400)));
      B.tiles.forEach(([i,j])=>{if(grid[i][j]!=='road')grid[i][j]='bridge';});}}];}
</script>
<script>
/* ================= 게임 상태 ================= */
const SAVE_KEY='ttukttak-3d-village-v1';
let state={mode:'demo',money:0,day:1,nextId:0,houses:[],roads:[],bridges:[],planted:[],cut:[],done:{},quiz:{right:0,total:0},pop:0,villageName:''};
const ui={tool:'inspect',sel:null,draft:{size:'s',floors:1,roof:'gable',win:'square',name:'',rot:0},roadDraft:[],tipEl:null,pendingTip:null,pvRot:0,busy:false,run:null,title:true,delTarget:null};
const houses=()=>state.houses;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){return state.mode==='free'?'무제한':fmt(n)+'만 원';}
function canPay(n){return state.mode!=='mission'||state.money>=n;}
function spend(n){if(state.mode!=='mission')return true;if(state.money<n){toast(`예산이 모자라요 (${fmt(n-state.money)}만 원 더 필요)`,'bad');return false;}
  state.money-=n;flashStat('s-money','down');return true;}
function earn(n){if(state.mode!=='mission'||n<=0)return;state.money+=n;flashStat('s-money','up');}
function advanceDays(n){state.day+=n;const inc=Math.round(state.pop*n*1);if(inc>0&&state.mode==='mission'){earn(inc);toast(`${n}일이 지났어요 · 주민 세금 +${fmt(inc)}만 원`);}}

/* ================= 연결과 점수 ================= */
let reached=new Set();
const key=(i,j)=>i+','+j;
function ring(h){const out=[];for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){if(Math.abs(a)<2&&Math.abs(b)<2)continue;const i=h.i+a,j=h.j+b;if(inMap(i,j))out.push([i,j]);}return out;}
function computeNets(){reached=new Set();const q=[];
  state.roads.forEach(r=>{if(r.entry&&r.stage>=4)r.tiles.forEach(([i,j])=>{reached.add(key(i,j));q.push([i,j]);});});
  const ok=(i,j)=>inMap(i,j)&&(grid[i][j]==='road'||grid[i][j]==='bridge');
  while(q.length){const [i,j]=q.shift();for(const [a,b] of[[1,0],[-1,0],[0,1],[0,-1]]){const I=i+a,J=j+b;if(ok(I,J)&&!reached.has(key(I,J))){reached.add(key(I,J));q.push([I,J]);}}}
  for(const b of state.bridges){const w=RIVER0-1,e=RIVER1+1,j=b.j;
    const side=(ii,dir)=>[[ii+dir,j],[ii,j-1],[ii,j+1]].some(([I,J])=>inMap(I,J)&&grid[I][J]==='road'&&reached.has(key(I,J))&&!(owner[I][J]===b));
    b.linked=b.stage>=4&&reached.has(key(w,j))&&reached.has(key(e,j))&&side(w,-1)&&side(e,1);}
  let pop=0;
  for(const h of houses()){h.road=ring(h).some(([i,j])=>reached.has(key(i,j)));const was=h.occupied;
    h.occupied=h.stage>=4&&!h.tilt&&h.road;h.pop=h.occupied?h.design.floors*SIZES[h.design.size].cap:0;pop+=h.pop;
    if(h.occupied&&!was&&!instant&&!ui.title)toast(`🎉 ${h.name}에 주민 ${h.pop}명이 이사 왔어요!`,'good');}
  state.pop=pop;updateTopbar();}
function treesNear(h,r=2){let n=0;for(let i=h.i-1-r;i<=h.i+1+r;i++)for(let j=h.j-1-r;j<=h.j+1+r;j++)if(trees[key(i,j)])n++;
  for(const R of state.roads)if(R.trees&&R.stage>=4)n+=R.tiles.filter(([i,j],q)=>q%2===0&&Math.abs(i-h.i)<=1+r&&Math.abs(j-h.j)<=1+r).length;return n;}
function roadPerk(h,k){return state.roads.some(R=>R.stage>=4&&R[k]&&R.tiles.some(([i,j])=>Math.abs(i-h.i)<=2&&Math.abs(j-h.j)<=2));}
function scoreSafety(h){if(h.tilt)return 25;const c=h.ch;let s=55+(FOUND[c.found]?.str||0)*10;if(c.frame==='rc'||c.frame==='steel')s+=10;if(c.insul==='glass')s+=5;return clamp(s,0,100);}
function scoreEnergy(h){const c=h.ch;let s=20+(INSUL[c.insul]?.energy||0)+(WINDOW[c.window]?.energy||0)+(HEAT[c.heat]?.energy||0)+(ROOFMAT[c.roofM]?.energy||0);if(c.frame==='wood')s+=5;return clamp(s,0,100);}
function scoreEco(h){const c=h.ch;let s=25+(FRAME[c.frame]?.eco||0)+(WALL[c.wall]?.eco||0)+(INSUL[c.insul]?.eco||0)+(ROOFMAT[c.roofM]?.eco||0)+(HEAT[c.heat]?.eco||0)+(FLOORMAT[c.floor]?.eco||0);
  s+=Math.min(15,treesNear(h)*3);return clamp(s,0,100);}
function ecoScore(){const done=houses().filter(h=>h.stage>=4);let s=0;
  const roadTrees=state.roads.filter(r=>r.trees&&r.stage>=4).reduce((a,r)=>a+Math.ceil(r.tiles.length/2),0);
  s+=Math.min(25,state.planted.length*1.5+roadTrees*.7);
  if(done.length)s+=done.reduce((a,h)=>a+scoreEco(h),0)/done.length*.4;
  s+=Math.min(15,done.filter(h=>h.ch.roofM==='solar'||h.ch.roofM==='green'||h.ch.heat==='solarth').length*5);
  s+=Math.min(15,Object.keys(trees).length/4);
  return Math.round(clamp(s,0,100));}
function happiness(){const done=houses().filter(h=>h.stage>=4);if(!done.length)return null;let t=0;
  for(const h of done){let v=(h.road?45:0)+Math.min(15,treesNear(h)*3)+scoreEnergy(h)*.25+(roadPerk(h,'walk')?5:0)+(roadPerk(h,'lamp')?5:0);if(h.tilt)v-=30;t+=clamp(v,0,100);}
  return Math.round(t/done.length);}

/* ================= 비용 ================= */
function phaseCost(h,k){const t=SIZES[h.design.size].t,f=h.design.floors,c=h.ch;
  if(k===0)return Math.round((FOUND[c.found]?.cost||0)*t);
  if(k===1)return Math.round((FRAME[c.frame]?.cost||0)*t*f);
  if(k===2)return Math.round(((WALL[c.wall]?.cost||0)*f+(ROOFMAT[c.roofM]?.cost||0)+(INSUL[c.insul]?.cost||0)*f+(WINDOW[c.window]?.cost||0)*f)*t);
  if(k===3){const u=c.util||{};let uc=0;for(const q in UTIL)if(u[q])uc+=UTIL[q].cost;return Math.round(((FLOORMAT[c.floor]?.cost||0)*f+(HEAT[c.heat]?.cost||0)+uc*f)*t);}return 0;}
function estimate(d){const t=SIZES[d.size].t,f=d.floors;return Math.round(t*(100+140*f+(80+30+25)*f+80+25*f+60+50*f)/10)*10;}
function phaseMissing(h,k){const c=h.ch,m=[],P=HOUSE_PHASES[k];
  P.quiz.forEach((q,i)=>{if(!h.qz[P.id+i])m.push('퀴즈');});
  if(k===0&&!c.found)m.push('기초');
  if(k===1&&!c.frame)m.push('골조');
  if(k===2){if(!c.insul)m.push('단열재');if(!c.wall)m.push('외벽');if(!c.window)m.push('창호');if(!c.roofM)m.push('지붕');}
  if(k===3){const u=c.util||{};if(!(u.elec&&u.supply&&u.drain))m.push('설비 3가지');if(!c.heat)m.push('난방');if(!c.floor)m.push('바닥재');if(!c.paper)m.push('벽지');}
  return [...new Set(m)];}
function roadPhaseCost(p,k){const n=p.tiles.length;if(k===2)return n*(ROADMAT[p.mat]?.cost||0);if(k===3)return n*(5+(p.walk?10:0)+(p.trees?8:0)+(p.lamp?8:0));return n*ROAD_PHASES[k].cost;}
function bridgePhaseCost(b){return b.btype?Math.round(BRIDGE[b.btype].cost*BRIDGE_SPAN/4):0;}
const TREE_COST=5;

/* ================= 세상 만들기·치우기 ================= */
function keepNatural(i,j){return (i<=4&&j>=11&&j<=15)||(i>=RIVER0-1&&i<=RIVER1+1)||(i>=3&&i<=12&&j>=4&&j<=20&&rnd()<.75)||(i>=19&&i<=22&&j>=5&&j<=20&&rnd()<.6);}
function resetWorld(){tweens.length=0;worldObjs.forEach(o=>scene.remove(o));worldObjs.length=0;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){grid[i][j]=(i>=RIVER0&&i<=RIVER1)?'river':null;owner[i][j]=null;}
  for(const k in trees)delete trees[k];seed=11;planGroup.clear();ghost.clear();plantTrees(keepNatural);}
function applyTilt(h,on){const to=on?.065:0;if(instant){h.g.rotation.x=to;return;}const from=h.g.rotation.x;tw(1200,p=>h.g.rotation.x=from+(to-from)*p);}
const HOUSE_BUILD=[foundationSteps,frameSteps,exteriorSteps,interiorSteps];
async function runSteps(steps){for(const s of steps)await s.run();}
async function houseTo(h,st){for(let k=h.stage;k<st;k++){await runSteps(HOUSE_BUILD[k](h));h.stage=k+1;if(k===1&&h.tilt)applyTilt(h,true);}}
async function roadTo(R,st){for(let k=R.stage;k<st;k++){await runSteps(roadPhaseSteps(R,k));R.stage=k+1;}}
async function bridgeTo(B,st){for(let k=B.stage;k<st;k++){await runSteps(bridgePhaseSteps(B,k));B.stage=k+1;}}
async function makeEntry(){const R=newRoad([[0,13],[1,13],[2,13],[3,13]],true);R.mat='asphalt';R.walk=true;R.lamp=true;state.roads.push(R);await roadTo(R,4);R.name='마을 입구 도로';}

/* ================= 저장·불러오기 ================= */
function saveGame(){if(state.mode==='demo')return;try{
  const pack={v:1,mode:state.mode,money:state.money,day:state.day,nextId:state.nextId,done:state.done,quiz:state.quiz,villageName:state.villageName,cut:state.cut,pop:state.pop,
    items:[...state.houses.map(h=>({t:'house',id:h.id,i:h.i,j:h.j,rot:h.rot,name:h.name,design:h.design,ch:h.ch,stage:h.stage,tilt:h.tilt,qz:h.qz,spent:h.spent})),
      ...state.roads.filter(r=>!r.entry).map(r=>({t:'road',id:r.id,tiles:r.tiles,stage:r.stage,mat:r.mat,walk:r.walk,trees:r.trees,lamp:r.lamp,qz:r.qz})),
      ...state.bridges.map(b=>({t:'bridge',id:b.id,j:b.j,stage:b.stage,btype:b.btype,color:b.color,qz:b.qz})),
      ...state.planted.map(p=>({t:'tree',id:p.id,i:p.i,j:p.j}))].sort((a,b)=>a.id-b.id)};
  localStorage.setItem(SAVE_KEY,JSON.stringify(pack));}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
async function startWorld(mode,pack){instant=true;resetWorld();
  state={mode,money:mode==='mission'?10000:0,day:1,nextId:0,houses:[],roads:[],bridges:[],planted:[],cut:[],done:{},quiz:{right:0,total:0},pop:0,villageName:''};
  await makeEntry();
  if(pack){Object.assign(state,{money:pack.money,day:pack.day,done:pack.done||{},quiz:pack.quiz||{right:0,total:0},villageName:pack.villageName||'',cut:pack.cut||[]});
    state.cut.forEach(([i,j])=>{const t=trees[key(i,j)];if(t){scene.remove(t);delete trees[key(i,j)];grid[i][j]=null;}});
    for(const it of pack.items){state.nextId=it.id-1;
      if(it.t==='tree'){plantTreeAt(it.i,it.j);state.planted.push({id:++state.nextId,i:it.i,j:it.j});}
      else if(it.t==='house'){const h=newHouse(it.i,it.j,it.design,it.name,it.rot);Object.assign(h.ch,it.ch);h.qz=it.qz||{};h.tilt=!!it.tilt;h.spent=it.spent||0;state.houses.push(h);await houseTo(h,it.stage);}
      else if(it.t==='road'){const R=newRoad(it.tiles);Object.assign(R,{mat:it.mat,walk:it.walk,trees:it.trees,lamp:it.lamp,qz:it.qz||{}});state.roads.push(R);await roadTo(R,it.stage);}
      else if(it.t==='bridge'){const sp=bridgeSpan(RIVER0,it.j);const B=newBridge(sp);Object.assign(B,{btype:it.btype,color:it.color,qz:it.qz||{}});state.bridges.push(B);await bridgeTo(B,it.stage);}}
    state.nextId=Math.max(state.nextId,pack.nextId||0);}
  instant=false;computeNets();applyNight();}

/* 타이틀 뒤에 보이는 예시 마을 */
async function buildDemo(){instant=true;resetWorld();state={...state,mode:'demo',houses:[],roads:[],bridges:[],planted:[],nextId:0};await makeEntry();
  const H=async(i,j,design,ch,rot=0)=>{const h=newHouse(i,j,design,'',rot);Object.assign(h.ch,ch);state.houses.push(h);await houseTo(h,4);};
  await H(8,10,{size:'l',floors:2,roof:'gable',win:'square'},{found:'mat',frame:'wood',insul:'cell',wall:'brick',wallC:'#A84B35',window:'double',roofM:'tile',roofC:'#3C4148',util:{elec:1,supply:1,drain:1},heat:'ondol',floor:'wood',paper:'#F5F1E6'});
  await H(20,9,{size:'s',floors:2,roof:'flat',win:'wide'},{found:'pile',frame:'rc',insul:'styro',wall:'stucco',wallC:'#C9DCEB',window:'triple',roofM:'green',roofC:'#6FA64A',util:{elec:1,supply:1,drain:1},heat:'heatpump',floor:'tile',paper:'#E3ECF5'});
  await H(20,17,{size:'w',floors:1,roof:'shed',win:'tall'},{found:'mat',frame:'steel',insul:'glass',wall:'panel',wallC:'#2D4A6B',window:'double',roofM:'solar',roofC:'#1F3556',util:{elec:1,supply:1,drain:1},heat:'solarth',floor:'vinyl',paper:'#FFF0C4'},Math.PI);
  const road=async(t,mat,o={})=>{const R=newRoad(t);Object.assign(R,{mat},o);state.roads.push(R);await roadTo(R,4);};
  await road([...Array(10)].map((_,k)=>[4+k,13]),'asphalt',{walk:true,trees:true,lamp:true});
  await road([[19,13],[20,13],[21,13],[22,13],[23,13]],'asphalt',{lamp:true});
  await road([[7,12]],'block');await road([[19,11],[19,12]],'block');await road([[21,14],[21,15]],'block');
  const B=newBridge(bridgeSpan(RIVER0,13));B.btype='cable';B.color='#C23B34';state.bridges.push(B);await bridgeTo(B,4);
  instant=false;computeNets();}
</script>
<script>
/* ================= 알림·통계 ================= */
const panel=$('#panel');
function toast(msg,kind=''){const box=$('#toasts'),el=document.createElement('div');el.className='toast '+kind;el.textContent=msg;box.appendChild(el);
  while(box.children.length>3)box.firstChild.remove();setTimeout(()=>el.remove(),3400);}
function flashStat(id,dir){const el=document.getElementById(id);if(!el)return;el.classList.remove('flash-up','flash-down');void el.offsetWidth;el.classList.add('flash-'+dir);setTimeout(()=>el.classList.remove('flash-'+dir),700);}
function updateTopbar(){if(!$('#s-money'))return;$('#s-money').textContent=money(state.money);$('#s-pop').textContent=state.pop+'명';
  const hp=happiness();$('#s-happy').textContent=hp===null?'-':hp+'%';$('#s-eco').textContent=ecoScore()+'점';$('#s-day').textContent=state.day+'일째';}

/* ================= 눌러서 보는 설명 ================= */
const popEl=$('#pop');
const tipA=(t,b)=>` data-tt="${esc(t)}" data-tb="${esc(b||'')}"`;
function showTip(el,t,b){t=t??el.dataset.tt;b=b??el.dataset.tb;if(!t)return;
  popEl.innerHTML=`<b>${t}</b>${b?`<p>${b}</p>`:''}`;popEl.hidden=false;
  const r=el.getBoundingClientRect(),pw=popEl.offsetWidth,ph=popEl.offsetHeight,pr=panel.getBoundingClientRect();let x,y;
  if(innerWidth>=820&&panel.contains(el)){x=pr.left-pw-12;y=r.top+r.height/2-ph/2;}else{x=r.left+r.width/2-pw/2;y=r.top-ph-8;if(y<8)y=r.bottom+8;}
  popEl.style.left=clamp(x,8,innerWidth-pw-8)+'px';popEl.style.top=clamp(y,8,innerHeight-ph-8)+'px';ui.tipEl=el;}
function hideTip(){popEl.hidden=true;ui.tipEl=null;}
document.addEventListener('pointerdown',e=>{if(!popEl.hidden&&!popEl.contains(e.target)&&!(e.target.closest&&e.target.closest('[data-tt]')))hideTip();},true);
function infoBtn(t,b){return `<button class="info" data-act="tip"${tipA(t,b)} aria-label="${esc(t)} 설명">?</button>`;}
function chipsText(ch){return ch?'<br>'+ch.map(([t,k])=>`<span class="tchip ${k}">${t}</span>`).join(' '):'';}

/* ================= 공통 조각 ================= */
function tile(act,k,cur,th,name,cost,tt,tb,off,badge){const on=Array.isArray(cur)?cur.includes(k):cur===k;
  return `<button class="tile ${off?'off':''}" data-act="${act}" data-v="${k}" aria-pressed="${on}" ${off?'aria-disabled="true"':''}${tipA(tt,tb)}>${thumb(th)}<span class="tn">${name}</span>${cost?`<span class="tc">${cost}</span>`:''}${badge?`<span class="tbadge">${badge}</span>`:''}${on&&/util|r-opt/.test(act)?'<span class="tchk">✓</span>':''}</button>`;}
function swatchesHTML(act,colors,cur){return `<div class="swatches">${colors.map(c=>`<button class="sw" style="background:${c}" data-act="${act}" data-v="${c}" aria-pressed="${cur===c}" aria-label="색 ${c}"></button>`).join('')}</div>`;}
function quizHTML(obj,k,q){const solved=obj.qz[k],wrong=(obj.qw&&obj.qw[k])||[];
  return `<div class="quiz ${solved?'solved':''}"><div class="q">${solved?'✅':'🔧'} ${q.q}</div>
    <div class="qopts">${q.opts.map(m=>`<button class="qopt ${solved&&m===q.a?'right':''} ${solved&&m!==q.a?'dim':''} ${wrong.includes(m)&&!solved?'wrong':''}" data-act="quiz" data-k="${k}" data-v="${m}"${tipA(MACHINE_NAME[m],MACHINE_DESC[m])}><img src="${MACHINE_IMG[m].src}" alt=""><span>${MACHINE_NAME[m]}</span></button>`).join('')}</div></div>`;}
function answerQuiz(obj,k,q,m){obj.qw=obj.qw||{};const sel=`[data-act="quiz"][data-k="${k}"][data-v="${m}"]`;
  if(obj.qz[k]){ui.pendingTip={sel};renderPanel();return;}
  const first=!(obj.qw[k]&&obj.qw[k].length);if(first)state.quiz.total++;
  if(m===q.a){obj.qz[k]=true;if(first)state.quiz.right++;ui.pendingTip={sel,t:`정답! ${MACHINE_NAME[m]}`,b:MACHINE_DESC[m]};}
  else{(obj.qw[k]=obj.qw[k]||[]).push(m);ui.pendingTip={sel,t:`${MACHINE_NAME[m]}는 아니에요`,b:MACHINE_DESC[m]+' 다시 골라 보세요.'};}
  renderPanel();}
function stepperHTML(names,tips,done,now){return `<div class="stepper ${names.length===5?'s4':''}">${names.map((n,i)=>`<button class="step ${i<done?'done':''} ${i===now?'now':''}" data-act="tip"${tipA(n,tips[i]||'')}><i></i>${n}</button>`).join('')}</div>`;}
function footHTML(cost,ready,missing,label){const over=!canPay(cost);
  return `<div class="pfoot"><div class="costline"><span>공사비</span><b class="${over?'over':''}">${state.mode==='free'?'무료 (자유 건설)':fmt(cost)+'만 원'}</b></div>
    ${!ready&&missing.length?`<div class="need">남은 것: ${missing.join(' · ')}</div>`:''}
    <button class="btn primary" data-act="build" ${ready&&!ui.busy?'':'disabled'}>${label}</button></div>`;}
function runFootHTML(){const {steps,k}=ui.run,pct=Math.round(k/steps.length*100);
  return `<div class="pfoot"><div class="costline"><span>공사 중… ${k+1}/${steps.length}단계</span><b>${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div></div>`;}
function runHTML(){const {steps,k}=ui.run;
  return `<div class="psec"><h4>지금 하는 공사 <span class="tag">화면에서 직접 지켜봐요</span></h4>
    <div class="segs">${[[1,'보통 속도'],[2.5,'빠르게'],[6,'아주 빠르게']].map(([v,n])=>`<button class="seg" data-act="speed" data-v="${v}" aria-pressed="${speed==v}">${n}</button>`).join('')}</div>
    <ol class="rsteps">${steps.map((s,i)=>`<li class="${i<k?'done':i===k?'now':''}">${s.n}${i===k?`<span class="d">${s.d}</span><span class="tools">${s.tools.map(t=>`<i>${t}</i>`).join('')}</span>`:''}</li>`).join('')}</ol></div>`;}
function head(eyebrow,title,tt,tb,extra=''){return `<div class="phead"><div class="eyebrow">${eyebrow}</div><div class="ptitle">${title}${tb?infoBtn(tt||title,tb):''}</div>${extra}</div>`;}
function previewHTML(label){return `<div class="psec"><div class="preview-wrap"><canvas id="preview"></canvas>${label?`<span class="plabel">${label}</span>`:''}<button class="pvrot" data-act="pvrot" aria-label="미리보기 돌리기" title="돌려 보기">⟳</button></div></div>`;}
const won=(n,unit)=>`${n}만${unit?'/'+unit:''}`;
const isRunning=o=>ui.run&&ui.run.obj===o;
const alive=o=>o&&(o.type==='house'?state.houses:o.type==='road'?state.roads:state.bridges).includes(o);

/* ================= 패널 ================= */
function renderPanel(){hideTip();const st=panel.scrollTop;let html='';
  if(ui.sel&&!alive(ui.sel))ui.sel=null;const o=ui.sel;
  if(o&&o.type==='house')html=o.stage>=4&&!isRunning(o)?houseReport(o):housePanel(o);
  else if(o&&o.type==='road')html=o.stage>=4&&!isRunning(o)?roadInfo(o):roadPanel(o);
  else if(o&&o.type==='bridge')html=o.stage>=4&&!isRunning(o)?bridgeInfo(o):bridgePanel(o);
  if(!html)html=toolPanel();
  panel.innerHTML=html;panel.scrollTop=st;panel.classList.remove('closed');
  if(ui.pendingTip){const pt=ui.pendingTip;ui.pendingTip=null;const el=panel.querySelector(pt.sel);if(el)showTip(el,pt.t,pt.b);}}
function toolPanel(){switch(ui.tool){
  case 'house':return designPanel();
  case 'road':return roadToolPanel();
  case 'bridge':return bridgeToolPanel();
  case 'tree':return `${head('환경','나무 심기','나무','그늘을 만들고 공기를 맑게 해요. 집 가까이 있으면 친환경 점수와 만족도가 올라가요.',`<div class="psub">빈 땅을 눌러요 · 1그루 ${TREE_COST}만 원</div>`)}
    <div class="psec"><div class="kv"><div><small>심은 나무</small><b>${state.planted.length}그루</b></div><div><small>친환경</small><b>${ecoScore()}점</b></div></div></div>`;
  case 'bulldoze':return bulldozePanel();
  default:return overviewPanel();}}
function overviewPanel(){const hs=houses(),doneH=hs.filter(h=>h.stage>=4).length;
  const working=[...hs.filter(h=>h.stage<4).map(h=>({o:h,name:h.name,next:isRunning(h)?'공사 중':HOUSE_PHASES[h.stage].short})),
    ...state.roads.filter(p=>p.stage<4).map(p=>({o:p,name:`도로 ${p.tiles.length}칸`,next:isRunning(p)?'공사 중':ROAD_PHASES[p.stage].name})),
    ...state.bridges.filter(b=>b.stage<4).map(b=>({o:b,name:b.btype?BRIDGE[b.btype].name:'다리',next:isRunning(b)?'공사 중':BRIDGE_PHASES[b.stage].name}))];
  ui.workList=working.map(w=>w.o);
  const acc=state.quiz.total?Math.round(state.quiz.right/state.quiz.total*100)+'%':'-';
  const flow=['설계','기초','골조','외장·지붕','내장·설비','입주'],flowTip=[...HOUSE_STEP_TIPS.slice(0,5),'<b>도로</b>가 마을 입구와 이어지면 주민이 이사 와요.'];
  return `${head('건설본부',state.villageName?esc(state.villageName):'우리 마을','','',`<div class="psub">${state.mode==='mission'?'미션 모드 · 왼쪽 아래 미션을 따라가요':'자유 건설 · 예산 걱정 없이 마음껏'}</div>`)}
  <div class="psec"><div class="kv"><div><small>완공한 집</small><b>${doneH}채</b></div><div><small>공사 중</small><b>${working.length}곳</b></div><div><small>완성한 도로</small><b>${state.roads.filter(r=>r.stage>=4).reduce((a,r)=>a+r.tiles.length,0)}칸</b></div><div><small>퀴즈 정답률</small><b>${acc}</b></div></div></div>
  ${working.length?`<div class="psec"><h4>공사 중</h4><div class="projlist">${working.map((w,i)=>`<button class="proj" data-act="goto" data-v="${i}"><b>${esc(w.name)}</b><small>다음: ${w.next}</small></button>`).join('')}</div></div>`:''}
  <div class="psec"><h4>집 짓는 순서</h4><div class="flowchips">${flow.map((f,i)=>`<button class="fchip" data-act="tip"${tipA(f,flowTip[i])}>${f}</button>`).join('<span class="arr">›</span>')}</div>
  <div class="explain">지도에서 건물·도로·다리를 누르면 이어서 공사하거나 성적표를 볼 수 있어요.</div></div>`;}

/* ---------- 설계 ---------- */
function designPanel(){const d=ui.draft;
  return `${head('건축 · 1단계','설계','설계',HOUSE_STEP_TIPS[0]+'<br>고른 다음 <b>지도에서 빈 땅</b>을 클릭해요.',stepperHTML(HOUSE_STEPS,HOUSE_STEP_TIPS,0,0))}
  ${previewHTML('설계도')}
  <div class="psec"><input type="text" id="dname" maxlength="12" placeholder="건물 이름 (예: 햇살집)" value="${esc(d.name)}"></div>
  <div class="psec"><h4>크기</h4><div class="tiles">${Object.entries(SIZES).map(([k,v])=>tile('dsize',k,d.size,v.th,v.name,v.desc,v.name,`${v.desc} · 한 층에 ${v.cap}명이 살아요.`)).join('')}</div></div>
  <div class="psec"><h4>층수</h4><div class="segs">${[1,2,3].map(f=>`<button class="seg" data-act="dfloor" data-v="${f}" aria-pressed="${d.floors===f}"${f===3?tipA('3층','3층은 튼튼한 철근콘크리트나 철골 뼈대로만 지을 수 있어요.'):''}>${f}층</button>`).join('')}</div></div>
  <div class="psec"><h4>지붕 모양</h4><div class="tiles c4">${Object.entries(ROOFS).map(([k,r])=>tile('droof',k,d.roof,'roof:'+k,r.name.replace('지붕',''),'',r.name,r.desc)).join('')}</div></div>
  <div class="psec"><h4>창문</h4><div class="tiles">${Object.entries(WINSTYLES).map(([k,w])=>tile('dwin',k,d.win,'win:'+k,w.name,'',w.name,`창 너비 ${w.w}m · 높이 ${w.h}m`)).join('')}</div></div>
  <div class="psec"><h4>현관 방향</h4><button class="btn small" data-act="drot">↻ 집을 90° 돌리기</button><div class="bnote">노란 표시가 현관이에요. 도로 쪽을 보게 하면 좋아요.</div></div>
  <div class="pfoot"><div class="costline"><span>예상 공사비</span><b>약 ${fmt(estimate(d))}만 원</b></div><div class="need" style="color:var(--blue)">👉 지도에서 빈 땅(3×3칸)을 클릭</div></div>`;}

/* ---------- 집 공정 ---------- */
function housePanel(h){const run=isRunning(h),k=run?ui.run.meta.k:h.stage,P=HOUSE_PHASES[k],c=h.ch,f=h.design.floors;let body='';
  if(run)body=runHTML();
  else{body+=`<div class="psec">${P.quiz.map((q,i)=>quizHTML(h,P.id+i,q)).join('')}</div>`;
    if(k===0)body+=`<div class="psec"><h4>땅 ${h.soft?`<button class="pill warn" data-act="tip"${tipA('무른 땅','강가라 물기가 많아요. 무거운 건물이 가라앉거나 기울 수 있어요.')}>⚠ 무른 땅</button>`:`<button class="pill ok" data-act="tip"${tipA('단단한 땅','건물 무게를 잘 버티는 땅이에요.')}>✓ 단단한 땅</button>`} <span class="tag">${f}층 집</span></h4>
      <div class="tiles">${Object.entries(FOUND).map(([q,v])=>tile('ch-found',q,c.found,'found:'+q,v.name,won(v.cost,'칸'),v.name,v.desc+chipsText(v.chips))).join('')}</div></div>`;
    else if(k===1)body+=`<div class="psec"><h4>뼈대 재료 <span class="tag">${f}층 집</span></h4><div class="tiles c4">${Object.entries(FRAME).map(([q,v])=>tile('ch-frame',q,c.frame,'frame:'+q,v.name,won(v.cost,'칸·층'),v.name,v.desc+chipsText(v.chips)+(v.max<f?`<br><b style="color:#FF9A8B">${f}층은 지을 수 없어요.</b>`:''),v.max<f,v.max<f?'✕':'')).join('')}</div></div>`;
    else if(k===2){body+=`<div class="psec"><h4>단열재</h4><div class="tiles">${Object.entries(INSUL).map(([q,v])=>tile('ch-insul',q,c.insul,'insul:'+q,v.name,won(v.cost),v.name,v.desc+'<br>벽 속에 넣어 여름엔 더위, 겨울엔 추위를 막아요.')).join('')}</div></div>`;
      body+=`<div class="psec"><h4>외벽</h4><div class="tiles c5">${Object.entries(WALL).map(([q,v])=>tile('ch-wall',q,c.wall,'wall:'+q,v.name.replace(/\(.*\)/,''),won(v.cost),v.name,v.desc)).join('')}</div>${c.wall?swatchesHTML('ch-wallC',WALL[c.wall].colors,c.wallC):''}</div>`;
      body+=`<div class="psec"><h4>창호</h4><div class="tiles">${Object.entries(WINDOW).map(([q,v])=>tile('ch-window',q,c.window,'window:'+q,v.name,won(v.cost),v.name,v.desc)).join('')}</div></div>`;
      const okRoof=Object.entries(ROOFMAT).filter(([,v])=>h.design.roof==='flat'?v.flat:v.pitched);
      body+=`<div class="psec"><h4>지붕 <span class="tag">${ROOFS[h.design.roof].name}</span></h4><div class="tiles c4">${okRoof.map(([q,v])=>tile('ch-roofM',q,c.roofM,'roofM:'+q,v.name.replace('아스팔트 ','').replace('(금속)',''),won(v.cost),v.name,v.desc)).join('')}</div>${c.roofM&&ROOFMAT[c.roofM].colors.length>1?swatchesHTML('ch-roofC',ROOFMAT[c.roofM].colors,c.roofC):''}</div>`;}
    else{const u=c.util||{};
      body+=`<div class="psec"><h4>설비 <span class="tag">3가지 모두</span></h4><div class="tiles">${Object.entries(UTIL).map(([q,v])=>tile('util',q,Object.keys(u).filter(x=>u[x]),'util:'+q,v.name,won(v.cost),v.name,v.desc)).join('')}</div></div>`;
      body+=`<div class="psec"><h4>난방</h4><div class="tiles">${Object.entries(HEAT).map(([q,v])=>tile('ch-heat',q,c.heat,'heat:'+q,v.name.replace(' 보일러','').replace(' 온수',''),won(v.cost),v.name,v.desc)).join('')}</div></div>`;
      body+=`<div class="psec"><h4>바닥재 · 벽지</h4><div class="tiles">${Object.entries(FLOORMAT).map(([q,v])=>tile('ch-floor',q,c.floor,'floor:'+q,v.name,won(v.cost),v.name,v.desc)).join('')}</div>${swatchesHTML('ch-paper',PAPER,c.paper)}</div>`;}}
  const missing=run?[]:phaseMissing(h,k),cost=phaseCost(h,k);
  const tilt=h.tilt?`<div class="psec"><div class="row"><button class="pill bad" data-act="tip"${tipA('건물이 기울었어요','땅이나 층수에 맞지 않는 기초를 썼어요. 말뚝을 더 박아 기초를 보강해야 사람이 살 수 있어요.')}>⚠ 기울어짐</button><button class="btn small" data-act="reinforce" ${ui.busy?'disabled':''}>기초 보강 (${fmt(SIZES[h.design.size].t*220)}만)</button></div></div>`:'';
  return `${head(esc(h.name),P.name,P.name,P.explain,stepperHTML(HOUSE_STEPS,HOUSE_STEP_TIPS,k+1,k+1))}
  ${previewHTML(k===3?'집 안 (투시)':'공사 현장')}${tilt}${body}
  ${run?runFootHTML():footHTML(cost,!missing.length,missing,`${P.name} 시작 🏗️`)}
  ${h.stage===0&&!run?'<div class="psec"><button class="linkbtn" data-act="cancel">설계 취소하고 땅 비우기</button></div>':''}`;}
function houseReport(h){const c=h.ch;
  const bar=(label,v,col,tb)=>`<button class="bar" data-act="tip"${tipA(label,tb)}><span>${label}</span><span class="track"><i style="width:${v}%;background:${col}"></i></span><b>${v}</b></button>`;
  const used=[['found:'+c.found,FOUND[c.found]],['frame:'+c.frame,FRAME[c.frame]],['wall:'+c.wall,WALL[c.wall]],['roofM:'+c.roofM,ROOFMAT[c.roofM]],['insul:'+c.insul,INSUL[c.insul]],['window:'+c.window,WINDOW[c.window]],['heat:'+c.heat,HEAT[c.heat]],['floor:'+c.floor,FLOORMAT[c.floor]]].filter(([,v])=>v);
  return `${head('준공 · 성적표',esc(h.name),'','',`<div class="psub">${SIZES[h.design.size].name} · ${h.design.floors}층 · ${ROOFS[h.design.roof].name}${h.spent?` · ${fmt(h.spent)}만 원`:''}</div>`)}
  ${previewHTML(h.occupied?`주민 ${h.pop}명`:'입주 대기')}
  <div class="psec"><div class="bars">${bar('튼튼함',scoreSafety(h),'#2F8A4E','기초와 뼈대가 땅과 층수에 잘 맞을수록 높아요.')}${bar('에너지 절약',scoreEnergy(h),'#D9A300','단열재·창호·난방·태양광이 좋을수록 높아요.')}${bar('친환경',scoreEco(h),'#3E8E5A','나무 재료, 재활용 단열재, 태양광, 주변 나무가 점수를 올려요.')}</div></div>
  <div class="psec"><h4>입주 조건</h4><div class="conn"><button class="${h.road?'y':'n'}" data-act="tip"${tipA(h.road?'도로 연결됨':'도로 연결 안 됨',h.road?'마을 입구까지 길이 이어져 있어요.':'집 둘레 칸까지 완성된 도로를 이어 마을 입구와 연결해요.')}>${h.road?'✔':'✖'} 도로</button><button class="${h.tilt?'n':'y'}" data-act="tip"${tipA(h.tilt?'기울어짐':'똑바로 섰어요',h.tilt?'기초를 보강해야 해요.':'기초가 땅에 잘 맞아요.')}>${h.tilt?'✖':'✔'} 안전</button></div>
  ${h.tilt?`<div class="row"><button class="pill bad" data-act="tip"${tipA('건물이 기울었어요','말뚝을 더 박아 기초를 보강하면 똑바로 서요.')}>⚠ 기울어짐</button><button class="btn small" data-act="reinforce">기초 보강 (${fmt(SIZES[h.design.size].t*220)}만)</button></div>`:''}</div>
  <div class="psec"><h4>사용한 자재</h4><div class="used">${used.map(([q,v])=>`<button class="uchip" data-act="tip"${tipA(v.name,v.desc||'')}>${thumb(q)}<span>${v.name}</span></button>`).join('')}</div></div>
  <div class="psec"><button class="btn" data-act="cut">${h.cut?'겉모습 보기':'🔍 속 들여다보기 (배관·배선)'}</button></div>`;}

/* ---------- 도로 ---------- */
const ROADCOL={asphalt:'#4A4F55',concrete:'#BDBDB5',block:'#C58F6E'};
function roadToolPanel(){const n=ui.roadDraft.length;
  return `${head('토목','도로 놓기','도로 놓는 법','• 강·건물 위에는 놓을 수 없어요. 강은 <b>다리</b>로 건너요.<br>• 왼쪽 <b>마을 입구</b> 도로와 이어져야 해요.<br>• 계획을 확정하면 4단계 공사를 해요.',`<div class="psub">지도에서 칸을 차례로 눌러 길을 그려요</div>`)}
  <div class="psec"><div class="explain">누른 칸이 <b>노란색</b>으로 표시돼요. 다시 누르면 빠져요. 집 둘레 칸까지 이어야 주민이 이사 와요.</div>
  <div class="kv"><div><small>고른 칸</small><b>${n}칸</b></div><div><small>길이</small><b>${n*2}m</b></div></div></div>
  <div class="pfoot"><div class="costline"><span>예상 공사비</span><b>약 ${fmt(n*80)}만 원</b></div>
  <button class="btn primary" data-act="road-commit" ${n?'':'disabled'}>도로 계획 확정</button><button class="btn" data-act="road-clear" ${n?'':'disabled'}>고른 칸 지우기</button></div>`;}
function roadLayersSVG(k,mat){const L=[['노상(흙)','#A98259',k>=1,'도로를 받치는 맨 아래 흙바닥이에요. 단단히 골라요.'],['노반(자갈)','#9C9C94',k>=2,'자갈을 깔고 다져서 무게를 넓게 나눠요.'],['포장층',mat?ROADCOL[mat]:'#4A4F55',k>=3,'차가 직접 닿는 겉면이에요.']];
  let y=64,out='';const hs=[22,16,10];
  L.forEach(([n,col,on,d],i)=>{const h=hs[i];y-=h;out+=`<g class="lay" data-act="tip"${tipA(n,d)}><rect x="10" y="${y}" width="190" height="${h}" fill="${on?col:'transparent'}" stroke="${on?'none':'#B9C6CF'}" stroke-dasharray="3 3"/><text x="208" y="${y+h/2+4}" font-size="11" fill="${on?'#1B2530':'#9AA6AF'}">${n}</text></g>`;});
  const lane=k>=4?`<rect x="60" y="${y-2}" width="16" height="2" fill="#F2C230"/><rect x="110" y="${y-2}" width="16" height="2" fill="#F2C230"/><rect x="160" y="${y-2}" width="16" height="2" fill="#F2C230"/>`:'';
  return `<svg viewBox="0 0 280 68" class="layers" aria-label="도로 층 단면">${lane}${out}</svg>`;}
function roadPanel(p){const run=isRunning(p),k=run?ui.run.meta.k:p.stage,R=ROAD_PHASES[k];let body='';
  if(run)body=runHTML();
  else{if(R.quiz)body+=`<div class="psec">${quizHTML(p,R.id,R.quiz)}</div>`;
    if(k===2)body+=`<div class="psec"><h4>포장 재료</h4><div class="tiles">${Object.entries(ROADMAT).map(([q,v])=>tile('r-mat',q,p.mat,'road:'+q,v.name,won(v.cost,'칸'),v.name,v.desc)).join('')}</div></div>`;
    if(k===3)body+=`<div class="psec"><h4>안전 시설 <span class="tag">여러 개 골라도 돼요</span></h4><div class="tiles">${Object.entries(ROPT).map(([q,[n,d,c]])=>tile('r-opt',q,Object.keys(ROPT).filter(x=>p[x]),'ropt:'+q,n,won(c,'칸'),n,d)).join('')}</div></div>`;}
  const missing=[];if(!run){if(R.quiz&&!p.qz[R.id])missing.push('퀴즈');if(k===2&&!p.mat)missing.push('포장 재료');}
  return `${head(`도로 ${p.tiles.length}칸 · ${p.tiles.length*2}m`,R.name,R.name,R.explain,stepperHTML(ROAD_STEPS,ROAD_STEP_TIPS,k,k))}
  ${previewHTML('')}<div class="psec">${roadLayersSVG(run?k+1:k,p.mat)}</div>${body}
  ${run?runFootHTML():footHTML(roadPhaseCost(p,k),!missing.length,missing,`${R.name} 시작 🚧`)}
  ${p.stage===0&&!run?'<div class="psec"><button class="linkbtn" data-act="cancel">도로 계획 취소</button></div>':''}`;}
function roadInfo(r){const linked=r.tiles.some(([i,j])=>reached.has(key(i,j)));
  return `${head('토목',r.entry?'마을 입구 도로':'완성된 도로','도로','차와 사람이 다니는 길이에요. 집 둘레까지 이어지면 주민이 이사 와요.',`<div class="psub">${ROADMAT[r.mat]?.name||''} · ${r.tiles.length*2}m · ${linked?'입구와 연결됨 ✔':'<b style="color:var(--bad)">입구와 끊김 ✖</b>'}</div>`)}
  ${previewHTML('')}<div class="psec"><h4>안전 시설</h4><div class="used">${Object.entries(ROPT).filter(([q])=>r[q]).map(([q,[n,d]])=>`<button class="uchip" data-act="tip"${tipA(n,d)}>${thumb('ropt:'+q)}<span>${n}</span></button>`).join('')||'<span class="psub">안전 시설 없음</span>'}</div></div>`;}

/* ---------- 다리 ---------- */
function bridgeToolPanel(){return `${head('토목','다리 놓기','다리 놓기','<b>강 위나 강둑을 클릭</b>하면 양쪽 강가를 잇는 다리 자리가 정해져요. 어느 줄에 놓을지는 내 마음!',`<div class="psub">강 폭 3칸 · 양쪽 강둑까지 5칸</div>`)}
  <div class="psec"><h4>다리 종류 미리 보기</h4><div class="tiles c4">${Object.entries(BRIDGE).map(([k,v])=>tile('tip',k,'','bridge:'+k,v.name,`${fmt(v.cost*BRIDGE_SPAN)}만`,v.name,v.desc)).join('')}</div>
  <div class="explain">다리 양쪽 끝이 <b>도로</b>와 이어져야 강 건너 마을까지 차가 다닐 수 있어요.</div></div>`;}
function bridgePanel(b){const run=isRunning(b),k=run?ui.run.meta.k:b.stage,R=BRIDGE_PHASES[k];let body='';
  if(run)body=runHTML();
  else{body+=`<div class="psec">${quizHTML(b,R.id,R.quiz)}</div>`;
    if(k===0)body+=`<div class="psec"><h4>다리 종류 <span class="tag">강 폭 3칸</span></h4><div class="tiles c4">${Object.entries(BRIDGE).map(([q,v])=>tile('b-type',q,b.btype,'bridge:'+q,v.name,`${fmt(v.cost*BRIDGE_SPAN)}만`,v.name,v.desc)).join('')}</div></div>`;
    if(k===3)body+=`<div class="psec"><h4>강철 부분 색 <span class="tag">녹 방지 도장</span></h4>${swatchesHTML('b-color',BRIDGE_COLORS,b.color)}</div>`;}
  const missing=[];if(!run){if(!b.qz[R.id])missing.push('퀴즈');if(k===0&&!b.btype)missing.push('다리 종류');if(k===3&&!b.color)missing.push('색');}
  return `${head(`${b.btype?BRIDGE[b.btype].name:'다리'} · 강 폭 3칸`,R.name,R.name,R.explain,stepperHTML(BRIDGE_STEPS,[...BRIDGE_PHASES.map(p=>p.explain),'사람과 차가 강을 건널 수 있어요.'],k,k))}
  ${previewHTML('')}${body}
  ${run?runFootHTML():footHTML(bridgePhaseCost(b),!missing.length,missing,`${R.name} 시작 🌉`)}
  ${b.stage===0&&!run?'<div class="psec"><button class="linkbtn" data-act="cancel">다리 계획 취소</button></div>':''}`;}
function bridgeInfo(b){const B=BRIDGE[b.btype];
  return `${head('토목 · 다리',B.name,B.name,B.desc,`<div class="psub">${b.linked?'양쪽 도로 연결 ✔':'<b style="color:var(--bad)">양쪽 끝에 도로를 이어요</b>'}</div>`)}${previewHTML('')}
  <div class="psec"><div class="flowchips">${BRIDGE_PHASES.map(p=>`<button class="fchip" data-act="tip"${tipA(p.name,p.explain)}>${p.name}</button>`).join('<span class="arr">›</span>')}</div></div>`;}
function bulldozePanel(){const t=ui.delTarget;
  if(!t)return head('철거','철거하기','철거','• 건물·도로·다리·나무를 눌러 골라요.<br>• 공사비는 돌려받지 못해요.','<div class="psub">없앨 것을 지도에서 눌러요</div>');
  const name=t.type==='tree'?'나무 한 그루':t.type==='house'?t.name:t.type==='road'?`도로 ${t.tiles.length}칸`:(t.btype?BRIDGE[t.btype].name:'다리');
  return `${head('철거',esc(name)+' 철거할까요?','','',`<div class="psub">${t.type==='tree'?'나무를 베면 친환경 점수가 내려가요.':'되돌릴 수 없고, 공사비도 돌려받지 못해요.'}</div>`)}
  <div class="pfoot"><button class="btn primary" data-act="demolish">철거하기</button><button class="btn" data-act="undel">그만두기</button></div>`;}
</script>
<script>
/* ================= 공사 진행 ================= */
async function runPhase(obj,steps,meta){ui.busy=true;ui.run={obj,steps,k:0,meta};ghost.clear();
  for(let i=0;i<steps.length;i++){ui.run.k=i;renderPanel();await steps[i].run();}ui.run=null;ui.busy=false;}
function afterChange(){computeNets();applyNight();checkMissions();saveGame();renderPanel();renderMission();}
function focusObj(o,dist){if(o.type==='house')return focus(o.cx,o.cz,dist||15);if(o.type==='bridge')return focus(RCX,o.z,dist||16);
  const c=o.tiles.map(([i,j])=>tc(i,j));return focus(c.reduce((a,p)=>a+p[0],0)/c.length,c.reduce((a,p)=>a+p[1],0)/c.length,dist||Math.max(14,o.tiles.length*1.4));}
async function startHousePhase(h){const k=h.stage;if(ui.busy||k>=4||phaseMissing(h,k).length)return;const cost=phaseCost(h,k);if(!spend(cost))return;h.spent+=cost;
  focusObj(h,k===3?12:k===0?13:17);await runPhase(h,HOUSE_BUILD[k](h),{k});h.stage=k+1;
  advanceDays(HOUSE_PHASES[k].days*((k===1||k===3)?h.design.floors:1));
  if(k===1){h.tilt=(h.soft&&h.ch.found!=='pile')||(h.design.floors>=3&&h.ch.found==='strip');
    if(h.tilt){applyTilt(h,true);toast(`⚠️ ${h.name}이(가) 기울었어요! 땅과 층수에 맞는 기초였을까요?`,'bad');}}
  if(k<3)toast(`${h.name} · ${HOUSE_PHASES[k].short} 완료`,'good');else toast(`🏠 ${h.name} 준공!`,'gold');
  afterChange();}
async function startRoadPhase(p){const k=p.stage,R=ROAD_PHASES[k];if(ui.busy||k>=4||(R.quiz&&!p.qz[R.id])||(k===2&&!p.mat))return;const cost=roadPhaseCost(p,k);if(!spend(cost))return;
  focusObj(p);await runPhase(p,roadPhaseSteps(p,k),{k});p.stage=k+1;advanceDays(Math.max(1,Math.ceil(p.tiles.length/3)));
  toast(p.stage>=4?'🛣️ 도로 개통!':`도로 · ${R.name} 완료`,p.stage>=4?'gold':'good');afterChange();}
async function startBridgePhase(b){const k=b.stage,R=BRIDGE_PHASES[k];if(ui.busy||k>=4||!b.qz[R.id]||(k===0&&!b.btype)||(k===3&&!b.color))return;const cost=bridgePhaseCost(b);if(!spend(cost))return;
  focusObj(b,k===1&&(b.btype==='cable'||b.btype==='susp')?20:16);await runPhase(b,bridgePhaseSteps(b,k),{k});b.stage=k+1;advanceDays(R.days);
  toast(b.stage>=4?`🌉 ${BRIDGE[b.btype].name} 개통!`:`다리 · ${R.name} 완료`,b.stage>=4?'gold':'good');afterChange();}
function reinforce(h){const c=SIZES[h.design.size].t*220;if(ui.busy||!spend(c))return;h.spent+=c;h.ch.found='pile';h.tilt=false;applyTilt(h,false);
  toast('말뚝을 더 박아 기초를 보강했어요. 집이 똑바로 섰어요!','good');afterChange();}
function freeTile(i,j){grid[i][j]=trees[key(i,j)]?'tree':null;owner[i][j]=null;}
function demolish(o){
  if(o.type==='tree'){const k=o.i+','+o.j;clearTree(o.i,o.j);const pi=state.planted.findIndex(p=>p.i===o.i&&p.j===o.j);if(pi>=0)state.planted.splice(pi,1);else state.cut.push([o.i,o.j]);}
  else{scene.remove(o.g);const wi=worldObjs.indexOf(o.g);if(wi>=0)worldObjs.splice(wi,1);
    if(o.type==='house'){footprint(o.i,o.j).forEach(([a,b])=>freeTile(a,b));state.houses.splice(state.houses.indexOf(o),1);}
    if(o.type==='road'){o.tiles.forEach(([a,b])=>{const br=state.bridges.find(x=>x.j===b&&(a===RIVER0-1||a===RIVER1+1));freeTile(a,b);if(br){owner[a][b]=br;grid[a][b]=br.stage>=4?'bridge':'bridge-work';}});state.roads.splice(state.roads.indexOf(o),1);}
    if(o.type==='bridge'){o.tiles.forEach(([a,b])=>{if(a>=RIVER0&&a<=RIVER1){grid[a][b]='river';owner[a][b]=null;}else if(owner[a][b]===o)freeTile(a,b);});state.bridges.splice(state.bridges.indexOf(o),1);}}
  if(ui.sel===o)ui.sel=null;ui.delTarget=null;toast('철거했어요');afterChange();}

panel.addEventListener('input',e=>{if(e.target.id==='dname')ui.draft.name=e.target.value;});
panel.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act,v=el.dataset.v,o=ui.sel;
  if(act==='tip'){if(ui.tipEl===el)hideTip();else showTip(el);return;}
  if(el.getAttribute('aria-disabled')==='true'){showTip(el);return;}
  const h=o&&o.type==='house'?o:null,p=o&&o.type==='road'?o:null,b=o&&o.type==='bridge'?o:null;
  if(el.dataset.tt&&act!=='quiz')ui.pendingTip={sel:`[data-act="${act}"][data-v="${v}"]`};
  switch(act){
    case 'pvrot':ui.pvRot=(ui.pvRot+1)&3;return;
    case 'speed':speed=+v;break;
    case 'dsize':ui.draft.size=v;drawDraft();break;
    case 'dfloor':ui.draft.floors=+v;drawDraft();break;
    case 'droof':ui.draft.roof=v;drawDraft();break;
    case 'dwin':ui.draft.win=v;drawDraft();break;
    case 'drot':ui.draft.rot=(ui.draft.rot+Math.PI/2)%(Math.PI*2);drawDraft();break;
    case 'goto':{const w=ui.workList&&ui.workList[+v];if(w){ui.sel=w;focusObj(w);}break;}
    case 'quiz':{const k=el.dataset.k;
      if(h){const ph=HOUSE_PHASES.find(P=>k.startsWith(P.id));answerQuiz(h,k,ph.quiz[+k.slice(ph.id.length)],v);}
      else if(p)answerQuiz(p,k,ROAD_PHASES.find(R=>R.id===k).quiz,v);else if(b)answerQuiz(b,k,BRIDGE_PHASES.find(R=>R.id===k).quiz,v);saveGame();return;}
    case 'util':if(h){h.ch.util[v]=!h.ch.util[v];}break;
    case 'reinforce':if(h)reinforce(h);return;
    case 'cut':if(h)setCut(h,!h.cut);break;
    case 'r-mat':if(p)p.mat=v;break;
    case 'r-opt':if(p)p[v]=!p[v];break;
    case 'b-type':if(b)b.btype=v;break;
    case 'b-color':if(b)b.color=v;break;
    case 'road-commit':{if(!ui.roadDraft.length)break;const R=newRoad(ui.roadDraft);state.roads.push(R);ui.roadDraft=[];drawRoadDraft();ui.sel=R;setTool('inspect',true);saveGame();return;}
    case 'road-clear':ui.roadDraft=[];drawRoadDraft();break;
    case 'cancel':if(o&&o.stage===0&&!isRunning(o)){demolish(o);return;}break;
    case 'demolish':if(ui.delTarget&&!ui.busy){demolish(ui.delTarget);return;}break;
    case 'undel':ui.delTarget=null;ghost.clear();break;
    case 'build':if(h)await startHousePhase(h);else if(p)await startRoadPhase(p);else if(b)await startBridgePhase(b);return;
    default:if(act.startsWith('ch-')&&h){const k=act.slice(3);h.ch[k]=v;
      if(k==='wall')h.ch.wallC=WALL[v].colors[0];if(k==='roofM')h.ch.roofC=ROOFMAT[v].colors[0];}}
  renderPanel();});

function buildToolbar(){$('#tools').innerHTML=TOOLS.map(t=>`${t.group?`<div class="tgroup">${t.group}</div>`:''}<button class="tool" data-tool="${t.id}" aria-pressed="${ui.tool===t.id}">${iconSVG(t.id)}<span>${t.name}</span></button>`).join('');

/* ================= 미리보기 (실제 3D 장면을 작게) ================= */
const pvCam=new THREE.PerspectiveCamera(38,1.6,.1,300);
function previewTarget(){const o=ui.sel;
  if(o&&o.type==='house'){const d=dims(o);return {x:o.cx,y:1.6+d.floors*.7,z:o.cz,d:10+d.floors*1.6};}
  if(o&&o.type==='bridge')return {x:RCX,y:1.4,z:o.z,d:13};
  if(o&&o.type==='road'){const c=o.tiles.map(([i,j])=>tc(i,j)),xs=c.map(p=>p[0]),zs=c.map(p=>p[1]);const ext=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...zs)-Math.min(...zs));
    return {x:(Math.max(...xs)+Math.min(...xs))/2,y:0,z:(Math.max(...zs)+Math.min(...zs))/2,d:Math.max(7,ext*.9+5)};}
  if(ui.tool==='house')return {x:0,y:2.4,z:-300,d:13};return null;}
function renderPreview(){const pc=document.getElementById('preview');if(!pc)return;const w=pc.clientWidth,h=pc.clientHeight,tg=previewTarget();if(!w||!h||!tg)return;
  const dpr=renderer.getPixelRatio(),cw=canvas.clientWidth,ch=canvas.clientHeight;if(w>cw||h>ch)return;
  if(pc.width!==Math.round(w*dpr)){pc.width=Math.round(w*dpr);pc.height=Math.round(h*dpr);}
  const a=performance.now()*.00015+ui.pvRot*Math.PI/2+.8;pvCam.aspect=w/h;pvCam.updateProjectionMatrix();
  pvCam.position.set(tg.x+Math.cos(a)*tg.d,tg.y+tg.d*.55,tg.z+Math.sin(a)*tg.d);pvCam.lookAt(tg.x,tg.y,tg.z);
  const gv=ghost.visible;ghost.visible=false;renderer.setScissorTest(true);renderer.setViewport(0,0,w,h);renderer.setScissor(0,0,w,h);renderer.render(scene,pvCam);ghost.visible=gv;
  const c2=pc.getContext('2d');c2.drawImage(renderer.domElement,0,renderer.domElement.height-h*dpr,w*dpr,h*dpr,0,0,pc.width,pc.height);
  renderer.setScissorTest(false);renderer.setViewport(0,0,cw,ch);}

/* ================= 카메라·낮밤 ================= */
function focus(x,z,dist=18,ms=900){if(instant)return Promise.resolve();const t0=controls.target.clone(),t1=V(x,.8,z),off=camera.position.clone().sub(controls.target),d0=off.length(),dir=off.normalize();
  return ctw(ms,p=>{controls.target.lerpVectors(t0,t1,p);camera.position.copy(controls.target).addScaledVector(dir,d0+(dist-d0)*p);});}
function orbitBy(a){const t=controls.target;let last=0;ctw(500,p=>{const dq=new THREE.Quaternion().setFromAxisAngle(_Y,a*(p-last));last=p;const o=camera.position.clone().sub(t).applyQuaternion(dq);camera.position.copy(t).add(o);});}
function zoomBy(f){const t=controls.target,off=camera.position.clone().sub(t),d0=off.length(),d1=clamp(d0*f,controls.minDistance,controls.maxDistance),dir=off.normalize();ctw(350,p=>camera.position.copy(t).addScaledVector(dir,d0+(d1-d0)*p));}
function goHome(){const p0=camera.position.clone(),t0=controls.target.clone();ctw(900,p=>{camera.position.lerpVectors(p0,HOME_POS,p);controls.target.lerpVectors(t0,HOME_T,p);});}
let night=false;
function applyNight(){scene.background.copy(night?SKY_NIGHT:SKY_DAY);scene.fog.color.copy(scene.background);hemi.intensity=night?.2:.72;sun.intensity=night?.14:.85;sun.color.set(night?0x9DB2FF:0xffffff);
  houses().forEach(h=>{if(h.stage>=4&&h.mats.glass){h.mats.glass.emissive.set(night?0xFFC870:0x000000);h.mats.glass.emissiveIntensity=night?.85:0;}});
  state.bridges.forEach(b=>b.mats.lamp.emissiveIntensity=night&&b.stage>=4?1.6:0);state.roads.forEach(r=>{if(r.lampMat)r.lampMat.emissiveIntensity=night?1.6:0;});
  const b=$('#night');if(b){b.textContent=night?'☀':'☾';b.title=night?'낮으로 바꾸기':'밤으로 바꾸기';}}
$('#z-in').onclick=()=>zoomBy(.72);$('#z-out').onclick=()=>zoomBy(1.38);$('#z-home').onclick=goHome;
$('#r-left').onclick=()=>orbitBy(-Math.PI/4);$('#r-right').onclick=()=>orbitBy(Math.PI/4);$('#night').onclick=()=>{night=!night;applyNight();};

/* ================= 지도 입력 ================= */
const ghost=new THREE.Group();scene.add(ghost);
const gOK=new THREE.MeshBasicMaterial({color:0x2E9E5B,transparent:true,opacity:.42,depthWrite:false}),gNO=new THREE.MeshBasicMaterial({color:0xD64545,transparent:true,opacity:.42,depthWrite:false}),
  gWarn=new THREE.MeshBasicMaterial({color:0xE08A1E,transparent:true,opacity:.45,depthWrite:false});
const gPlane=new THREE.PlaneGeometry(1.9,1.9);
function tilesMesh(group,tiles,mat){group.clear();tiles.forEach(([i,j])=>{if(!inMap(i,j))return;const [x,z]=tc(i,j);const m=new THREE.Mesh(gPlane,mat);m.rotation.x=-Math.PI/2;m.position.set(x,.08,z);group.add(m);});}
const ray=new THREE.Raycaster(),gPlaneY=new THREE.Plane(_Y,0),ptrs=new Map();let down=null;
function pickTile(e){const r=canvas.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(v,camera);
  const p=new THREE.Vector3();if(!ray.ray.intersectPlane(gPlaneY,p))return null;const i=Math.floor((p.x+HALF)/TILE),j=Math.floor((p.z+HALF)/TILE);return inMap(i,j)?{i,j}:null;}
function objTiles(o){return o.type==='house'?footprint(o.i,o.j):o.tiles;}
function onHover(t){if(ui.busy||ui.title||!t){if(!ui.delTarget)ghost.clear();return;}
  const T=ui.tool;
  if(T==='house')tilesMesh(ghost,footprint(t.i,t.j),!canHouse(t.i,t.j)?gNO:isSoft(t.i,t.j)?gWarn:gOK);
  else if(T==='road')tilesMesh(ghost,[[t.i,t.j]],canRoad(t.i,t.j)||ui.roadDraft.some(q=>q[0]===t.i&&q[1]===t.j)?gOK:gNO);
  else if(T==='bridge'){const sp=bridgeSpan(t.i,t.j);if(sp)tilesMesh(ghost,sp.tiles,canBridge(sp)?gOK:gNO);else ghost.clear();}
  else if(T==='tree')tilesMesh(ghost,[[t.i,t.j]],grid[t.i][t.j]===null?gOK:gNO);
  else if(T==='bulldoze'&&!ui.delTarget){const o=owner[t.i][t.j];if(o&&!(o.entry))tilesMesh(ghost,objTiles(o),gNO);else if(grid[t.i][t.j]==='tree')tilesMesh(ghost,[[t.i,t.j]],gNO);else ghost.clear();}
  else if(T==='inspect'){const o=owner[t.i][t.j];if(o)tilesMesh(ghost,objTiles(o),gOK);else ghost.clear();}}
function onTap(t){if(ui.title)return;const T=ui.tool;
  if(T==='inspect'){const o=owner[t.i][t.j];if(o){ui.sel=o;focusObj(o);renderPanel();}else if(ui.sel){ui.sel=null;renderPanel();}return;}
  if(ui.busy){toast('지금 하는 공사가 끝나면 할 수 있어요');return;}
  if(T==='house'){if(!canHouse(t.i,t.j)){toast('여기는 지을 수 없어요. 강·도로·다른 건물과 겹치지 않는 빈 땅 3×3칸을 골라요','bad');return;}
    const n=state.houses.length+1,h=newHouse(t.i,t.j,ui.draft,(ui.draft.name||'').trim()||`${n}호 집`,ui.draft.rot);state.houses.push(h);ui.draft.name='';
    ui.sel=h;setTool('inspect',true);focusObj(h,15);if(h.soft)toast('⚠ 강가의 무른 땅이에요. 기초를 잘 골라야 해요!','bad');saveGame();return;}
  if(T==='road'){const k=ui.roadDraft.findIndex(q=>q[0]===t.i&&q[1]===t.j);
    if(k>=0)ui.roadDraft.splice(k,1);else if(canRoad(t.i,t.j))ui.roadDraft.push([t.i,t.j]);
    else{toast(grid[t.i][t.j]==='river'?'강 위에는 다리를 놓아야 해요':'이미 무언가 있는 칸이에요','bad');return;}drawRoadDraft();renderPanel();onHover(t);return;}
  if(T==='bridge'){const sp=bridgeSpan(t.i,t.j);if(!sp){toast('강물이나 바로 옆 강둑을 눌러 주세요');return;}if(!canBridge(sp)){toast('이 줄에는 이미 다리나 건물이 있어요','bad');return;}
    const B=newBridge(sp);state.bridges.push(B);ui.sel=B;setTool('inspect',true);focusObj(B);saveGame();return;}
  if(T==='tree'){if(grid[t.i][t.j]!==null){toast('빈 땅에만 심을 수 있어요','bad');return;}if(!spend(TREE_COST))return;
    const tr=plantTreeAt(t.i,t.j);pop(tr,400);state.planted.push({id:++state.nextId,i:t.i,j:t.j});computeNets();checkMissions();saveGame();renderPanel();renderMission();return;}
  if(T==='bulldoze'){const o=owner[t.i][t.j];
    if(o&&o.entry){toast('마을 입구 도로는 없앨 수 없어요');return;}
    if(o&&isRunning(o))return;
    if(o){ui.delTarget=o;tilesMesh(ghost,objTiles(o),gNO);}else if(grid[t.i][t.j]==='tree'){ui.delTarget={type:'tree',i:t.i,j:t.j};tilesMesh(ghost,[[t.i,t.j]],gNO);}else return;
    renderPanel();}}
canvas.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,1);down=ptrs.size===1?{x:e.clientX,y:e.clientY,t:performance.now()}:null;hideTip();});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!e.buttons)onHover(pickTile(e));});
canvas.addEventListener('pointerleave',()=>{if(!ui.delTarget)ghost.clear();});
const endPtr=e=>{const one=ptrs.size===1;ptrs.delete(e.pointerId);if(e.type==='pointerup'&&one&&down&&e.button===0){const d=Math.hypot(e.clientX-down.x,e.clientY-down.y);
  if(d<8&&performance.now()-down.t<700){const t=pickTile(e);if(t){if(e.pointerType!=='mouse')onHover(t);onTap(t);}}}if(!ptrs.size)down=null;};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||ui.title)return;
  if(e.key==='Escape'){hideTip();ui.sel=null;ui.delTarget=null;ghost.clear();renderPanel();}
  if(e.key==='q'||e.key==='Q')orbitBy(-Math.PI/4);if(e.key==='e'||e.key==='E')orbitBy(Math.PI/4);});

/* ================= 미션 ================= */
let missionOpen=true;
function currentMission(){return MISSIONS.find(m=>!state.done[m.id])||null;}
function renderMission(){const box=$('#mission');if(state.mode!=='mission'||ui.title){box.hidden=true;return;}box.hidden=false;
  const m=currentMission(),n=Object.keys(state.done).length;
  if(!m){box.innerHTML=`<div class="mhead"><b>모든 미션 완료!</b><span>${n}/${MISSIONS.length}</span></div><div class="mbody"><div class="mdesc">${esc(state.villageName||'우리 마을')}이 완성됐어요. 이제 자유롭게 꾸며 보세요.</div><div class="mfoot"><button class="linkbtn" id="m-cert">마을 완성 증서 보기</button></div></div>`;$('#m-cert').onclick=showCert;return;}
  box.classList.toggle('collapsed',!missionOpen);
  box.innerHTML=`<div class="mhead"><b>미션 ${MISSIONS.indexOf(m)+1}</b><span class="mkind">${m.kind}</span><span>${n}/${MISSIONS.length}</span><button class="linkbtn" style="color:#fff;margin-left:8px" id="m-toggle">${missionOpen?'접기':'펼치기'}</button></div>
   <div class="mbody"><div class="mtitle">${m.title}</div><div class="mdesc">${m.desc}</div>
   <div class="mfoot"><button class="pill" id="m-hint"${tipA('💡 힌트',m.hint)}>💡 힌트</button><span>보상 +${fmt(m.reward)}만 원</span><button class="linkbtn" id="m-all">전체 미션</button></div></div>`;
  $('#m-toggle').onclick=()=>{missionOpen=!missionOpen;renderMission();};
  const hb=$('#m-hint');hb.onclick=()=>{if(ui.tipEl===hb)hideTip();else showTip(hb);};$('#m-all').onclick=showMissions;}
function showMissions(){const cur=currentMission();
  modal('미션 목록',`<p class="bnote">건축과 토목 미션을 차례로 해내며 나만의 마을을 완성해요. 어디에, 어떤 모양으로 지을지는 모두 내가 정해요.</p>
  <div class="mlist">${MISSIONS.map((m,i)=>`<div class="mitem ${state.done[m.id]?'done':''} ${cur===m?'cur':''}"><i>${state.done[m.id]?'✓':i+1}</i><div><b>${m.title}</b> <span class="kindtag">${m.kind}</span> <span style="color:var(--ink-3);font-size:12px">+${fmt(m.reward)}만</span><small>${m.desc}</small></div></div>`).join('')}</div>`);}
function checkMissions(){if(state.mode!=='mission')return;let changed=false;
  for(const m of MISSIONS){if(state.done[m.id])continue;let ok=false;try{ok=m.check();}catch(e){}
    if(!ok)break;state.done[m.id]=true;changed=true;earn(m.reward);toast(`🏅 미션 성공: ${m.title} (+${fmt(m.reward)}만 원)`,'gold');
    if(m.id==='m10')setTimeout(showCert,900);}
  if(changed){renderMission();updateTopbar();}}

  const card=(th,n,d,sub='')=>`<button class="bcard" data-act="tip"${tipA(n,d)}>${th}<b>${n}</b>${sub?`<small>${sub}</small>`:''}</button>`;let body='';
  if(tab==='intro')body=`<div class="bgrid c2">${card('<span class="bico">🏠</span>','건축','사람이 안에서 생활하는 <b>건물</b>을 짓는 일이에요.','집 · 학교 · 병원')}${card('<span class="bico">🌉</span>','토목','땅과 물을 다루어 생활의 바탕을 만드는 일이에요.','도로 · 다리 · 상하수도')}</div>
    <h3>건설할 때 생각할 것</h3><div class="bgrid c4">${[['안전','튼튼하게 지어 사람을 지켜요.'],['편리','쓰기 좋고 다니기 좋게 지어요.'],['환경','자연을 아끼고 에너지를 덜 써요.'],['아름다움','보기 좋고 주변과 어울리게 지어요.']].map(([n,d])=>card('',n,d)).join('')}</div>`;
  if(tab==='house')body=`<div class="flowchips big">${HOUSE_STEPS.map((n,i)=>`<button class="fchip" data-act="tip"${tipA(n,HOUSE_STEP_TIPS[i])}>${n}</button>`).join('<span class="arr">›</span>')}</div>
    <h3>기초</h3><div class="bgrid c3">${Object.entries(FOUND).map(([k,v])=>card(thumb('found:'+k),v.name,v.desc)).join('')}</div>
    <h3>골조(뼈대)</h3><div class="bgrid c4">${Object.entries(FRAME).map(([k,v])=>card(thumb('frame:'+k),v.name,v.desc,`${v.max}층까지`)).join('')}</div>
    <h3>지붕 모양</h3><div class="bgrid c4">${Object.entries(ROOFS).map(([k,v])=>card(thumb('roof:'+k),v.name,v.desc)).join('')}</div>`;
  if(tab==='machine')body=`<div class="bgrid c4">${Object.keys(MACHINE_SVG).map(k=>card(`<img src="${MACHINE_IMG[k].src}" alt="">`,MACHINE_NAME[k],MACHINE_DESC[k])).join('')}</div>`;
  if(tab==='road')body=`<div class="flowchips big">${ROAD_PHASES.map(p=>`<button class="fchip" data-act="tip"${tipA(p.name,p.explain)}>${p.name}</button>`).join('<span class="arr">›</span>')}</div>
    <h3>포장 재료</h3><div class="bgrid c3">${Object.entries(ROADMAT).map(([k,v])=>card(thumb('road:'+k),v.name,v.desc)).join('')}</div>
    <h3>안전 시설</h3><div class="bgrid c3">${Object.entries(ROPT).map(([k,[n,d]])=>card(thumb('ropt:'+k),n,d)).join('')}</div>`;
  if(tab==='bridge')body=`<div class="bgrid c4">${Object.entries(BRIDGE).map(([k,v])=>card(thumb('bridge:'+k),v.name,v.desc)).join('')}</div>
    <h3>다리 놓는 순서</h3><div class="flowchips big">${BRIDGE_PHASES.map(p=>`<button class="fchip" data-act="tip"${tipA(p.name,p.explain)}>${p.name}</button>`).join('<span class="arr">›</span>')}</div>`;
  const m=modal('건설 도감',`<div class="tabs">${tabs.map(([k,n])=>`<button data-tab="${k}" aria-pressed="${k===tab}">${n}</button>`).join('')}</div><p class="bnote">카드를 누르면 설명이 나와요</p>${body}`);
  m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showBook(b.dataset.tab));}
function showMenu(){const m=modal('메뉴',`<div class="row"><button class="btn" id="mn-missions" ${state.mode!=='mission'?'disabled':''}>미션 목록</button><button class="btn" id="mn-help">조작 방법</button></div>
    <div class="row"><button class="btn" id="mn-title">처음 화면으로</button><button class="btn" id="mn-new">새로 하기</button></div>
    <p class="bnote">${state.mode==='mission'?'미션 모드':'자유 건설'} · 공사 단계를 마칠 때마다 이 브라우저에 자동 저장돼요</p>`,{narrow:true});
  m.querySelector('#mn-missions').onclick=()=>{closeModal();showMissions();};m.querySelector('#mn-help').onclick=showHelp;
  m.querySelector('#mn-title').onclick=()=>{closeModal();saveGame();showStart();};
  m.querySelector('#mn-new').onclick=()=>{if(ui.busy){toast('공사가 끝난 뒤에 할 수 있어요');return;}const mm=modal('새로 시작할까요?','<p>지금까지 지은 마을이 모두 사라져요.</p><div class="row"><button class="btn primary" id="cf-ok">새로 시작</button><button class="btn" id="cf-no">그만두기</button></div>',{narrow:true});
    mm.querySelector('#cf-ok').onclick=()=>{closeModal();clearSave();showStart();};mm.querySelector('#cf-no').onclick=closeModal;};}
function showHelp(){modal('조작 방법',`<div class="keys"><div><kbd>끌기</kbd><span>화면 돌리기</span></div><div><kbd>휠</kbd><span>확대·축소</span></div>
  <div><kbd>두 손가락</kbd><span>확대·축소·이동</span></div><div><kbd>오른쪽 끌기</kbd><span>화면 옮기기</span></div>
  <div><kbd>Q</kbd><kbd>E</kbd><span>화면 돌리기</span></div><div><kbd>Esc</kbd><span>선택 취소</span></div></div>`,{narrow:true});}
function showCert(){const hs=houses().filter(h=>h.stage>=4);
  const m=modal('마을 완성 증서',`<div class="cert"><div class="cert-top">${EMBLEM}<div><small>뚝딱 건설본부가 인증합니다</small><input type="text" id="vname" maxlength="14" placeholder="마을 이름을 지어 주세요" value="${esc(state.villageName)}"></div></div>
    <div class="kv"><div><small>주민</small><b>${state.pop}명</b></div><div><small>만족도</small><b>${happiness()??'-'}%</b></div><div><small>친환경</small><b>${ecoScore()}점</b></div><div><small>공사 기간</small><b>${state.day}일</b></div>
    <div><small>완공한 집</small><b>${hs.length}채</b></div><div><small>다리</small><b>${state.bridges.filter(b=>b.stage>=4).map(b=>BRIDGE[b.btype].name).join(', ')||'-'}</b></div></div>
    <div class="used">${hs.map(h=>`<span class="uchip">${thumb('roof:'+h.design.roof)}<span>${esc(h.name)} · ${h.design.floors}층</span></span>`).join('')}</div>
    <p class="bnote">어디에 무엇을 지을지 스스로 정해 완성한, 하나뿐인 마을이에요.</p></div>
    <div class="row"><button class="btn primary" id="cert-ok">이름 정하고 계속 꾸미기</button></div>`);
  m.querySelector('#cert-ok').onclick=()=>{state.villageName=m.querySelector('#vname').value.trim();closeModal();saveGame();renderPanel();renderMission();};}
$('#btn-book').onclick=()=>showBook();$('#btn-menu').onclick=showMenu;

/* ================= 타이틀 화면 ================= */
const EMBLEM=`<svg class="emblem" viewBox="0 0 120 120" aria-hidden="true"><defs><clipPath id="emc"><circle cx="60" cy="60" r="56"/></clipPath></defs>
<circle cx="60" cy="60" r="58" fill="#F2B300"/><g clip-path="url(#emc)"><rect width="120" height="120" fill="#D6ECF3"/>
<path d="M0 92 Q30 84 60 90 T120 88 V120 H0Z" fill="#86BA5E"/><rect x="0" y="96" width="120" height="10" fill="#3F8FC2"/>
<path d="M8 96 H112" stroke="#6F767D" stroke-width="3"/><path d="M14 96 Q60 58 106 96" fill="none" stroke="#C23B34" stroke-width="3.5"/>
<path d="M36 96V80M48 96V72M60 96V70M72 96V72M84 96V80" stroke="#C23B34" stroke-width="1.4"/>
<rect x="30" y="50" width="30" height="26" fill="#E7DCC8"/><path d="M26 52 L45 36 L64 52Z" fill="#3C4148"/><rect x="36" y="58" width="7" height="7" fill="#7FA6C4"/><rect x="48" y="62" width="7" height="14" fill="#7B4F2C"/>
<rect x="82" y="20" width="4" height="60" fill="#F2B300" stroke="#23272B" stroke-width="1"/><rect x="64" y="18" width="40" height="4" fill="#F2B300" stroke="#23272B" stroke-width="1"/><path d="M98 22V40" stroke="#23272B" stroke-width="1.2"/><rect x="94" y="40" width="8" height="5" fill="#23272B"/></g>
<circle cx="60" cy="60" r="56" fill="none" stroke="#23272B" stroke-width="4"/><circle cx="60" cy="60" r="51" fill="none" stroke="#F2B300" stroke-width="2" stroke-dasharray="6 4"/></svg>`;
function showStart(){ui.title=true;ui.sel=null;hideTip();closeModal();document.body.classList.add('titling');$('#mission').hidden=true;
  const st=$('#start');st.hidden=false;const saved=loadSave();
  st.innerHTML=`<div class="card"><div class="logo">${EMBLEM}<div><div class="kicker">5학년 실과 · 생활 속 건축과 토목</div><h1>뚝딱<br><em>건설 마을</em></h1></div></div>
    <p>설계도를 그리고, 기초부터 지붕까지 실제 순서대로 집을 지어요. 도로를 닦고 강에 다리를 놓아 나만의 마을을 완성해요.</p>
    <div class="order"><span>설계</span><span class="arrow">→</span><span>기초</span><span class="arrow">→</span><span>골조</span><span class="arrow">→</span><span>외장·지붕</span><span class="arrow">→</span><span>내장·설비</span><span class="arrow">→</span><span>입주</span></div>
    <div class="modes"><button class="mode primary" id="st-mission"><b>미션 모드</b><span>예산 1억 원 · 건축·토목 미션 10개로 마을 완성</span></button>
      <button class="mode" id="st-free"><b>자유 건축</b><span>예산 걱정 없이 마음껏 짓기</span></button>
      ${saved?`<button class="mode" id="st-load"><b>이어하기</b><span>${saved.mode==='mission'?'미션':'자유'} · ${saved.day}일째 · 주민 ${saved.pop||0}명</span></button>`:''}</div>
    <div class="foot">화면을 끌어 돌리고, 휠이나 두 손가락으로 확대해요.</div></div>`;
  $('#st-mission').onclick=()=>beginMode('mission');$('#st-free').onclick=()=>beginMode('free');if(saved)$('#st-load').onclick=()=>beginMode(saved.mode,saved);
  controls.autoRotate=true;controls.autoRotateSpeed=.5;
  if(state.mode!=='demo')buildDemo().then(()=>{camera.position.copy(HOME_POS);controls.target.copy(HOME_T);applyNight();});}
async function beginMode(mode,pack){const st=$('#start');st.innerHTML=`<div class="card"><div class="logo">${EMBLEM}<div><h1>마을을<br><em>준비하고 있어요</em></h1></div></div></div>`;
  await new Promise(r=>setTimeout(r,30));
  await startWorld(mode,pack);ui.title=false;controls.autoRotate=false;st.hidden=true;document.body.classList.remove('titling');
  ui.sel=null;ui.roadDraft=[];drawRoadDraft();speed=1;buildToolbar();setTool('inspect');camera.position.copy(HOME_POS);controls.target.copy(HOME_T);
  renderMission();updateTopbar();saveGame();
  if(mode==='mission'&&!pack)setTimeout(()=>toast('미션 1: 첫 집 짓기! 왼쪽 [집 짓기]를 눌러 설계부터 시작해요','gold'),400);}

/* ================= 시작 ================= */
let last=performance.now(),frame=0;
function loop(now){const dt=Math.min(100,now-last);last=now;runTweens(dt);window._waterTex.offset.y-=dt*.00004;
  controls.update();const t=controls.target;t.x=clamp(t.x,-26,26);t.z=clamp(t.z,-26,26);t.y=clamp(t.y,0,6);
  if(!ui.title&&(++frame%2===0))renderPreview();renderer.render(scene,camera);requestAnimationFrame(loop);}
(async function init(){buildToolbar();drawDraft();await buildDemo();applyNight();showStart();requestAnimationFrame(loop);})();
</script>

</body></html>
